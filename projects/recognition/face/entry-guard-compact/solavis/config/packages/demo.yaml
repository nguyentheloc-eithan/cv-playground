# DEMO PACKAGE. Load with:  python -m solavis.manage seed --package demo
# Fills the CRM, billing, support and device inventory with sample companies so every screen has something to show.
# All names, phones and addresses below are made up. Photo paths are relative to the repository root.
name: demo
staff:
  - { email: staff@solavis.vn,   password: demo1234, name: Solavis Admin, staff_role: admin }
  - { email: sales@solavis.vn,   password: demo1234, name: Sales Lead,    staff_role: sales }
  - { email: support@solavis.vn, password: demo1234, name: Support Agent, staff_role: support }
  - { email: finance@solavis.vn, password: demo1234, name: Finance,       staff_role: finance }
inventory: { count: 8, model: Solavis Cam 4G, prefix: SOL-2611, cost_vnd: 2000000 }   # total stock units to keep
tenants:
  - name: Demo Home (Hanoi)
    plan: home
    status: active
    contact_name: Tran Minh Anh
    phone: "0901 000 001"
    address: "12 Example Street, Ba Dinh, Hanoi"
    industry: Residential
    source: Referral
    account_manager: sales@solavis.vn
    users:
      - { email: owner@demo.vn,  password: demo1234, role: owner,  name: Tran Minh Anh }
      - { email: family@demo.vn, password: demo1234, role: member, name: Family member }
    cameras:
      - { name: Front gate, claim_code: SOL-4F7K-2Q9D }
    people:
      - { name: Person A, kind: known,     photos: "data/photos/5/*.jpg", max_photos: 3, consent: "Demo data" }
