# Where face snapshots are stored. Customers' images never leave the storage you choose here.
driver: local                    # local | s3   (s3 works with AWS S3, Cloudflare R2, Backblaze B2, MinIO)
local:
  path: data/solavis/snaps       # relative to the repository root
s3:                              # pip install -r requirements-prod.txt
  bucket: ${S3_BUCKET:-}
  region: ${S3_REGION:-auto}
  endpoint_url: ${S3_ENDPOINT:-}     # empty for AWS; set for R2 / B2 / MinIO
  access_key: ${S3_ACCESS_KEY:-}
  secret_key: ${S3_SECRET_KEY:-}
  prefix: snaps/
