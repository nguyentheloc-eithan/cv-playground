<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solavis ERP</title><meta name="robots" content="noindex"><meta name="theme-color" content=""><link rel="stylesheet" href="/assets/solavis-tokens.css"><link rel="stylesheet" href="/assets/app.css"></head><body>
<div id="root"></div>
<script src="/assets/common.js"></script>
<script>
let ME=null,SH=null,SUM=null,PLANS=[],STAFF=[],CAT=null,timer=null,ST={seclog:'',stage:'',q:'',inv_status:'',tk:'active',inv:'',tasks:'mine',tab:'overview'};
const STAGES=[['','All'],['lead','Lead'],['trial','Trial'],['active','Active'],['past_due','Past due'],['suspended','Suspended'],['closed','Closed']];
const can=p=>ME.perms.includes('*')||ME.perms.includes(p);
const TITLES={dashboard:['Dashboard','Business overview'],customers:['Customers','Accounts, subscriptions and contacts'],billing:['Billing','Invoices, payments and plans'],support:['Support','Customer tickets'],inventory:['Inventory','Device stock and assignments'],tasks:['Tasks','Follow-ups for the team'],organization:['Organization','Departments, heads and rights'],access:['Access review','Who can do what, right now'],security:['Security','Sign-ins, face checks and the tamper-evident log'],audit:['Audit log','Every sensitive action'],system:['System','Health and configuration']};
mountAuth($('root'),{title:'Staff console',role:'staff',onReady:u=>{ME=u;boot()}});
function boot(){
  SH=mountShell({root:$('root'),brandSub:'Enterprise (ERP)',user:{name:ME.name,email:ME.email,roleLabel:ME.is_super?'President':(ME.job_title||'Staff')+(ME.is_head?' · Head':'')},onNav:{bell:()=>nav('support')},
   search:can('accounts.read')?{placeholder:'Search customers',run:q=>{ST.q=q;ST.stage='';PG.customers=1;nav('customers');render()}}:null,
   groups:()=>{const a=(k,l,i,p,b)=>(!p||can(p))?[[k,l,i,b]]:[];return [{label:'Overview',items:[...a('dashboard','Dashboard','dashboard','')]},
     {label:'Business',items:[...a('customers','Customers','customers','accounts.read'),...a('billing','Billing','billing','billing.read'),...a('support','Support','support','support.read',SUM?.tickets_open||'')]},
     {label:'Operations',items:[...a('inventory','Inventory','inventory','inventory.read'),...a('tasks','Tasks','tasks','tasks')]},
     {label:'Company',items:[...a('organization','Organization','org',''),...a('access','Access review','access','staff.read'),...a('security','Security','secure','security.read'),...a('audit','Audit log','audit','audit.read'),...a('system','System','system','system.read')]}].filter(g=>g.items.length)}});
  window.onhashchange=()=>render();window.rerender=()=>render();if(!location.hash)nav(firstAllowed());
  clearInterval(timer);timer=setInterval(()=>{if(!document.querySelector('.modalbg')&&!document.activeElement?.matches('input,textarea,select'))render(true)},6000);render()}
const NEED={dashboard:'',customers:'accounts.read',billing:'billing.read',support:'support.read',inventory:'inventory.read',tasks:'tasks',organization:'',access:'staff.read',security:'security.read',audit:'audit.read',system:'system.read'};
const firstAllowed=()=>Object.keys(NEED).find(k=>!NEED[k]||can(NEED[k]));
async function render(quiet){const r=route();let page=r.page||firstAllowed();if(!V[page]||(NEED[page]&&!can(NEED[page]))){page=firstAllowed();if(location.hash!=='#/'+page)return nav(page)}
  try{SUM=await api('/api/admin/summary')}catch(e){if(e.status===401)return location.reload()}
  SH.renderNav(page);const ti=TITLES[page];SH.setTitle(ti[0],ti[1]);$('belldot').classList.toggle('hide',!(SUM&&SUM.tickets_unassigned));
  if(quiet&&V[page].live===false)return;if(!quiet&&!$('pg').innerHTML)$('pg').innerHTML=skeleton();
  try{const html=await V[page](r);const y=scrollY;$('pg').innerHTML=html;if(quiet)scrollTo(0,y)}catch(e){if(e.status===401)return location.reload();$('pg').innerHTML=`<div class="banner bad">${esc(e.message)}</div>`}}
const stageSel=(id,cur)=>can('accounts.write')?`<select class="sm inline" aria-label="Stage" onchange="setT(${id},{status:this.value})">${STAGES.slice(1).map(([k,l])=>`<option value="${k}" ${k===cur?'selected':''}>${l}</option>`).join('')}</select>`:badge(cur);
const planSel=(id,cur)=>can('accounts.write')?`<select class="sm inline" aria-label="Plan" onchange="setT(${id},{plan_id:this.value})">${PLANS.map(p=>`<option value="${p.id}" ${p.id===cur?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`:esc(cur);
const invBadge=s=>badge(s==='sent'?'unpaid':s);
const dtable0=(head,rows)=>`<div class="tw"><table class="dt"><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const loadPlans=async()=>{PLANS=await api('/api/admin/plans')};
const search=(id,val,ph,fn)=>`<label class="search">${ico('search','s18')}<input id="${id}" value="${esc(val)}" placeholder="${esc(ph)}" aria-label="${esc(ph)}" onkeydown="if(event.key==='Enter'){${fn}(this.value)}"></label>`;

const V={
 async dashboard(){const s=SUM;const h=s.has;if(h['accounts.read'])await loadPlans();const overdue=h['billing.read']?(await api('/api/admin/invoices?status=overdue')):[];const st=s.by_status||{};
  const k=[];
  if(h['billing.read']){k.push(kpi({label:'Monthly recurring revenue',value:vnd(s.mrr),foot:'Active and past-due customers',icon:'coin'}));k.push(kpi({label:'Overdue',value:vnd(s.overdue_amount),foot:`${s.overdue_count} invoice(s)`,icon:'alert',tone:s.overdue_count?'danger':'success'}))}
  if(h['accounts.read']){k.push(kpi({label:'Customers',value:s.tenants,foot:`${st.active} active · ${st.trial} trial · ${st.lead} lead`,icon:'customers',tone:'info'}));k.push(kpi({label:'New customers (30 days)',value:'+'+s.new_30d,foot:`${s.churn_30d} closed`,icon:'customers',tone:'success'}))}
  if(h['support.read'])k.push(kpi({label:'Open tickets',value:s.tickets_open,foot:`${s.tickets_unassigned} unassigned`,icon:'support',tone:s.tickets_unassigned?'warning':'success'}));
  if(h['inventory.read']&&s.fleet){k.push(kpi({label:'Devices in the field',value:s.fleet.units,foot:`${s.fleet.online} online · ${s.fleet.locked} locked`,icon:'devices',tone:s.fleet.locked?'danger':'success'}));k.push(kpi({label:'In stock',value:s.fleet.in_stock,foot:`${s.fleet.rma} returned`,icon:'inventory',tone:'neutral'}))}
  if(h['system.read']&&s.events_today!==undefined)k.push(kpi({label:'Events today',value:s.events_today,foot:'Across all customers',icon:'reports',tone:'neutral'}));
  const cards=[];
  if(h['accounts.read']){cards.push(`<div class="card c6"><div class="card-h"><h2>Pipeline</h2></div>${seg(STAGES.slice(1).map(([kk,l])=>[kk,l,st[kk]]),'','goStage')}<div style="margin-top:var(--sv-space-6)"><div class="card-h"><h2>Trials ending within 7 days</h2></div>${s.trials_ending.length?s.trials_ending.map(t=>`<div class="lrow">${avatar(t.name,'s32')}<div class="body"><a href="#/customers/${t.id}"><b>${esc(t.name)}</b></a></div><span class="muted">${dshort(t.trial_end)}</span></div>`).join(''):empty({icon:'check',title:'No trials ending soon'})}</div></div>`)}
  if(h.tasks)cards.push(`<div class="card c6"><div class="card-h"><h2>My tasks</h2><a href="#/tasks">View all</a></div>${s.my_tasks.length?s.my_tasks.map(t=>`<div class="lrow"><button class="btn sm" aria-label="Mark done" onclick="doneTask(${t.id})">${ico('check','s16')}</button><div class="body"><div class="t">${esc(t.title)}</div><div class="meta">${esc(t.tenant||'')} · due ${dshort(t.due)}</div></div></div>`).join(''):empty({icon:'tasks',title:'No open tasks'})}</div>`);
  if(h['billing.read'])cards.push(`<div class="card c6"><div class="card-h"><h2>Overdue invoices</h2><a href="#/billing">View all</a></div>${overdue.length?overdue.slice(0,6).map(i=>`<div class="lrow"><div class="body"><a href="#/customers/${i.tenant_id}"><b>${esc(i.tenant)}</b></a><div class="meta">${esc(i.number)} · due ${dshort(i.due)}</div></div><b>${vnd(i.total)}</b></div>`).join(''):empty({icon:'check',title:'Nothing overdue'})}</div>`);
  if(h['support.read'])cards.push(`<div class="card c6"><div class="card-h"><h2>Recent tickets</h2><a href="#/support">View all</a></div>${s.recent_tickets.length?s.recent_tickets.map(t=>`<div class="lrow"><div class="body"><a href="#/support/${t.id}"><b>#${t.id} ${esc(t.subject)}</b></a><div class="meta">${esc(t.tenant)} · ${ago(t.updated)}</div></div>${badge(t.status)}</div>`).join(''):empty({icon:'check',title:'Queue is clear'})}</div>`);
  if(s.team)cards.push(`<div class="card c12"><div class="card-h"><h2>My team</h2><a href="#/organization/${ME.department_id}">Manage people and rights</a></div>${dtable0(['Person','Role / title','Open tasks','Overdue','Last sign-in'],s.team.map(m=>[`<div class="name">${avatar(m.name||m.email,'s32')}<div><b>${esc(m.name||m.email)}</b><small>${esc(m.email)}</small></div></div>`,esc(m.job_title||'–'),m.open_tasks,m.overdue_tasks?`<span class="badge danger">${m.overdue_tasks}</span>`:'–',`<span class="muted">${m.last_login?ago(m.last_login):'never'}</span>`]))}</div>`);
  const nothing=!k.length&&!cards.length;
  return pageHead(can('accounts.write')?`<button class="btn primary" onclick="newCustomer()">${ico('plus','s18')} New customer</button>`:'')+(nothing?`<div class="card">${empty({icon:'org',title:'Welcome',text:'Your role has no business pages yet. Open Organization to see your department, or ask your head for rights.'})}</div>`:'')+(k.length?`<div class="grid kpigrid">${k.join('')}</div>`:'')+(cards.length?`<div class="grid">${cards.join('')}</div>`:'')},

 async customers(r){await loadPlans();if(r.id)return customerPage(+r.id);const a=await api(`/api/admin/tenants?q=${encodeURIComponent(ST.q)}`);const counts={};a.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);const rows=a.filter(x=>!ST.stage||x.status===ST.stage);
  return pageHead(can('accounts.write')?`<button class="btn primary" onclick="newCustomer()">${ico('plus','s18')} New customer</button>`:'')+
  dtable({id:'customers',size:10,toolbar:seg(STAGES.map(([k,l])=>[k,l,k?counts[k]||0:a.length]),ST.stage,'setStage')+(ST.q?`<span class="badge info">Search: ${esc(ST.q)}</span><button class="btn ghost sm" onclick="ST.q='';render()">Clear</button>`:''),
   head:[{l:'Customer'},{l:'Stage'},{l:'Plan'},{l:'Monthly',num:1},{l:'Devices',num:1},{l:'Tickets',num:1},{l:'Unpaid',num:1},{l:'Manager'},{l:'Created'}],emptyState:{icon:'customers',title:'No customers match',text:'Try another stage or search.'},
   rows:rows.map(t=>({click:`nav('customers/${t.id}')`,cells:[`<div class="name">${avatar(t.name,'s32')}<div><b>${esc(t.name)}</b><small>${esc(t.contact_name||'')} ${esc(t.phone||'')}</small></div></div>`,badge(t.effective_status)+(t.effective_status!==t.status?` <span class="caption">(${t.status})</span>`:''),esc(t.plan_name),['active','past_due'].includes(t.status)?vnd(t.price_vnd):'–',`${t.cameras}/${t.max_cameras}`,t.open_tickets||'–',t.unpaid?`<b style="color:var(--sv-danger)">${vnd(t.unpaid)}</b>`:'–',`<span class="muted">${esc((t.account_manager||'').split('@')[0])}</span>`,`<span class="muted">${dshort(t.created)}</span>`]}))})},

 async billing(){await loadPlans();const inv=await api('/api/admin/invoices');const f=ST.inv_status;const rows=inv.filter(i=>!f||i.state===f);const sum=s=>inv.filter(i=>i.state===s).reduce((a,i)=>a+i.total,0);
  return pageHead(can('billing.write')?`<button class="btn primary" onclick="newInvoice()">${ico('plus','s18')} New invoice</button>`:'')+`<div class="grid kpigrid">${kpi({label:'Unpaid',value:vnd(sum('sent')),icon:'invoice',tone:'warning'})}${kpi({label:'Overdue',value:vnd(sum('overdue')),icon:'alert',tone:sum('overdue')?'danger':'success'})}${kpi({label:'Collected (listed)',value:vnd(sum('paid')),icon:'check',tone:'success'})}${kpi({label:'MRR',value:vnd(SUM.mrr),icon:'coin'})}</div>`+
  dtable({id:'invoices',toolbar:seg([['','All',inv.length],['sent','Unpaid'],['overdue','Overdue'],['paid','Paid'],['void','Void']],f,'setInv'),head:[{l:'Invoice'},{l:'Customer'},{l:'Description'},{l:'Issued'},{l:'Due'},{l:'Amount',num:1},{l:'Status'},{l:''}],emptyState:{icon:'invoice',title:'No invoices'},
   rows:rows.map(i=>({cells:[`<b>${esc(i.number)}</b>`,`<a href="#/customers/${i.tenant_id}">${esc(i.tenant)}</a>`,`<span class="muted">${esc(i.description)}</span>`,dshort(i.issued),dshort(i.due),vnd(i.total),invBadge(i.state),
    can('billing.write')&&['sent','overdue'].includes(i.state)?`<div class="row nowrap"><button class="btn sm" onclick="payInv(${i.id},'${esc(i.number)}')">Mark paid</button>${rowMenu([{label:'Void invoice',danger:true,run:()=>voidInv(i.id,i.number)}])}</div>`:'']}))})+
  `<div style="height:var(--sv-space-6)"></div>`+dtable({id:'plans',size:20,toolbar:`<h2 style="flex:1">Plans</h2>${can('plans.write')?`<button class="btn sm" onclick="editPlan()">${ico('plus','s16')} New plan</button>`:''}`,head:[{l:'Id'},{l:'Name'},{l:'Price / month',num:1},{l:'Cameras',num:1},{l:'People',num:1},{l:'Events/day',num:1},{l:'Watch list'},{l:''}],
   rows:PLANS.map(p=>({cells:[p.id,`<b>${esc(p.name)}</b>`,vnd(p.price_vnd),p.max_cameras,p.max_people,p.events_per_day,p.watchlist?'Yes':'No',can('plans.write')?rowMenu([{label:'Edit plan',run:()=>editPlan(p)}]):'']}))})+`<p class="caption" style="margin-top:var(--sv-space-3)">Plan changes apply to every customer on that plan at once. The shipped prices are samples; set your own.</p>`},

 async support(r){if(r.id)return ticketPage(+r.id);const q=ST.tk==='me'?'?assignee=me&status=active':ST.tk==='none'?'?assignee=none&status=active':ST.tk==='active'?'?status=active':'?status='+ST.tk;const t=await api('/api/admin/tickets'+q);
  return dtable({id:'tickets',toolbar:seg([['active','Active'],['me','Mine'],['none','Unassigned'],['solved','Solved'],['closed','Closed']],ST.tk,'setTk'),head:[{l:'#'},{l:'Subject'},{l:'Customer'},{l:'Priority'},{l:'Status'},{l:'Assignee'},{l:'Updated'}],emptyState:{icon:'check',title:'Queue is clear',text:'No tickets match this filter.'},
   rows:t.map(x=>({click:`nav('support/${x.id}')`,cells:[x.id,`<b>${esc(x.subject)}</b><div class="caption">${esc(x.category)}</div>`,esc(x.tenant),x.priority==='high'?badge('critical','High'):`<span class="sec">${esc(x.priority)}</span>`,badge(x.status),`<span class="muted">${esc((x.assignee||'unassigned').split('@')[0])}</span>`,`<span class="muted">${ago(x.updated)}</span>`]}))})},

 async inventory(){const t=await api('/api/admin/tenants');const it=await api('/api/admin/inventory');const f=ST.inv;const rows=it.filter(i=>!f||i.status===f);const n=s=>it.filter(i=>i.status===s).length;const tl=JSON.stringify(t.map(x=>[x.id,x.name])).replace(/"/g,'&quot;');
  return pageHead(can('inventory.write')?`<button class="btn primary" onclick="addUnits()">${ico('plus','s18')} Add units</button>`:'')+`<div class="grid kpigrid">${kpi({label:'In stock',value:n('in_stock'),icon:'inventory',tone:'success'})}${kpi({label:'Assigned',value:n('assigned'),icon:'devices',tone:'info'})}${kpi({label:'Returned / RMA',value:n('rma'),icon:'alert',tone:n('rma')?'warning':'neutral'})}${kpi({label:'Retired',value:n('retired'),icon:'close',tone:'neutral'})}</div>`+
  dtable({id:'inventory',toolbar:seg([['','All',it.length],['in_stock','In stock'],['assigned','Assigned'],['rma','RMA'],['retired','Retired']],f,'setInvF'),head:[{l:'Serial'},{l:'Model'},{l:'Status'},{l:'Customer'},{l:'Camera'},{l:'Warranty'},{l:'Cost',num:1},{l:''}],emptyState:{icon:'inventory',title:'No units'},
   rows:rows.map(i=>({cells:[`<b>${esc(i.serial)}</b>`,esc(i.model),badge(i.status,i.status.replace('_',' ')),i.tenant?`<a href="#/customers/${i.tenant_id}">${esc(i.tenant)}</a>`:'–',i.camera_state?badge(i.camera_state)+` <span class="caption">${i.last_seen?ago(i.last_seen):''}</span>`:'–',`<span class="muted">${dshort(i.warranty_until)}</span>`,i.cost_vnd?vnd(i.cost_vnd):'–',
    [can('inventory.write')&&i.status==='in_stock'?`<button class="btn sm" onclick='assignUnit(${i.id},"${esc(i.serial)}",${JSON.stringify(t.map(x=>[x.id,x.name])).replace(/'/g,"&#39;")})'>Assign</button>`:'',
     can('devices.revoke')&&i.status==='assigned'?rowMenu([{label:'Returned or lost…',danger:true,run:()=>deviceAct(i.id,'rma',i.serial)}]):'',
     can('devices.revoke')&&['rma','retired'].includes(i.status)?`<button class="btn sm" onclick="deviceAct(${i.id},'restock','${esc(i.serial)}')">Restock</button>`:''].join('')]}))})+
  `<p class="caption" style="margin-top:var(--sv-space-3)">Staff manage units as assets. Live camera control, faces and snapshots belong to the customer and are not visible here.</p>`},

 async tasks(){await loadStaff();const t=await api('/api/admin/tasks?scope='+ST.tasks);
  return pageHead(`<button class="btn primary" onclick="newTask()">${ico('plus','s18')} New task</button>`)+dtable({id:'tasks',toolbar:(ME.is_super||ME.is_head)?seg([['mine','Mine'],['all',ME.is_super?'Everyone':'My team']],ST.tasks,'setTasks'):`<h2>My tasks</h2>`,head:[{l:''},{l:'Task'},{l:'Customer'},{l:'Due'},{l:'Assignee'}],emptyState:{icon:'tasks',title:'No tasks'},
   rows:t.map(x=>({cells:[x.status==='open'?`<button class="btn sm" aria-label="Mark done" onclick="doneTask(${x.id})">${ico('check','s16')}</button>`:badge('done'),`<b>${esc(x.title)}</b>`,x.tenant?`<a href="#/customers/${x.tenant_id}">${esc(x.tenant)}</a>`:'–',dshort(x.due),`<span class="muted">${esc((x.assignee||'').split('@')[0])}</span>`]}))})},

 async audit(){const a=await api('/api/admin/audit?limit=500');return dtable({id:'audit',size:15,head:[{l:'Time'},{l:'Actor'},{l:'Action'},{l:'Detail'},{l:'Customer'}],emptyState:{icon:'audit',title:'No events'},
   rows:a.map(x=>({cells:[`<span class="muted">${when(x.ts)}</span>`,esc(x.actor),`<b>${esc(x.action)}</b>`,`<span class="muted">${esc(x.target)}</span>`,x.tenant_id?`<a href="#/customers/${x.tenant_id}">#${x.tenant_id}</a>`:'']}))})},
 async system(){const s=await api('/api/admin/system');return `<div class="grid kpigrid">${Object.entries(s.checks).map(([k,v])=>kpi({label:k[0].toUpperCase()+k.slice(1),value:badge(v==='ok'?'ok':'fail',v==='ok'?'Healthy':'Failing'),foot:v==='ok'?'':esc(v),icon:'system',tone:v==='ok'?'success':'danger'})).join('')}</div>${s.warnings.length?`<div class="banner warn">${ico('alert')}<div>${s.warnings.map(esc).join('<br>')}</div></div>`:''}
  <div class="card"><div class="card-h"><h2>Effective configuration</h2><span class="caption">Secrets hidden</span></div><pre style="overflow:auto;font:400 12px/18px ui-monospace,Menlo,monospace;margin:0">${esc(JSON.stringify(s.config,null,2))}</pre><p class="caption" style="margin-top:var(--sv-space-3)">Edit the YAML files in solavis/config (or SOLAVIS_CONFIG_DIR) and restart.</p></div>`}};
V.system.live=false;
const goStage=k=>{ST.stage=k;PG.customers=1;nav('customers')},setStage=k=>{ST.stage=k;PG.customers=1;render()},setInv=k=>{ST.inv_status=k;PG.invoices=1;render()},setTk=k=>{ST.tk=k;PG.tickets=1;render()},setInvF=k=>{ST.inv=k;PG.inventory=1;render()},setTasks=k=>{ST.tasks=k;render()};
async function loadStaff(p='tasks'){STAFF=(await api('/api/admin/org/directory?purpose='+p)).map(x=>x.email)}

// ── customer page ──
async function customerPage(id){const d=await api('/api/admin/tenants/'+id);const t=d.tenant;const tab=ST.tab;
  const tabs=[['overview','Overview'],['billing','Billing',d.invoices.length],['support','Support',d.tickets.filter(x=>['open','pending'].includes(x.status)).length||''],['devices','Devices',d.devices.length],['people','Contacts and users',d.contacts.length+d.users.length],['notes','Notes and tasks',d.notes.length],['activity','Activity']];
  let body='';
  if(tab==='overview')body=`<div class="grid"><div class="card c6"><div class="card-h"><h2>Profile</h2></div><dl class="kv"><dt>Contact</dt><dd>${esc(t.contact_name||'–')}</dd><dt>Phone</dt><dd>${esc(t.phone||'–')}</dd><dt>Address</dt><dd>${esc(t.address||'–')}</dd><dt>Tax code</dt><dd>${esc(t.tax_code||'–')}</dd><dt>Industry</dt><dd>${esc(t.industry||'–')}</dd><dt>Source</dt><dd>${esc(t.source||'–')}</dd><dt>Account manager</dt><dd>${esc(t.account_manager||'–')}</dd><dt>Customer since</dt><dd>${dshort(t.created)}</dd></dl></div>
   <div class="card c6"><div class="card-h"><h2>Subscription</h2>${badge(t.effective_status)}</div><div style="font-size:28px;line-height:36px;font-weight:600">${esc(t.plan_name)}</div><div class="sec">${vnd(t.price_vnd)} per month${t.status==='trial'?` · trial ends ${dshort(t.trial_end)}`:''}</div>
   <div style="margin-top:var(--sv-space-4)">${usage('Devices',d.devices.length,t.max_cameras)}${usage('People (count only)',d.people_count,t.max_people)}${usage('Events today',t.events_today,t.events_per_day)}</div></div></div>
   ${d.notes.filter(n=>n.pinned).length?`<div class="card"><div class="card-h"><h2>Pinned notes</h2></div>${d.notes.filter(n=>n.pinned).map(n=>`<div class="lrow"><div class="body">${esc(n.text)}<div class="meta">${esc(n.author)} · ${ago(n.created)}</div></div></div>`).join('')}</div>`:''}`;

const secDetail=d=>{if(!d||typeof d!=='object')return '';return Object.entries(d).map(([k,v])=>`${k}: ${typeof v==='object'?JSON.stringify(v):v}`).join(' · ').slice(0,140)};
const setSecLog=k=>{ST.seclog=k;PG.seclog=1;render()};
const zoomSnap=s=>modal(`${mhead('Captured frame')}<img src="/api/admin/org/security-log/snap/${s}" alt="Captured frame" style="width:100%;border-radius:var(--sv-radius-lg)">`,{title:'Captured frame'});
const revokeSession=id=>guard(async()=>{await api(`/api/auth/sessions/${id}/revoke`,{method:'POST'});toast('Session signed out');render()});
const reEnroll=()=>faceVerify().then(()=>faceEnroll('')).then(()=>{toast('Face re-enrolled');render()}).catch(e=>{if(e.message!=='Cancelled')toast(e.message,'danger')});
const showRights=i=>{const x=window._ar[i];modal(`${mhead(x.name||x.email)}<p class="sec">${esc(x.department)} · ${x.is_super?'President':x.is_head?'Department head':esc(x.role||'No role')}</p><h3 style="margin:var(--sv-space-4) 0 var(--sv-space-2)">Effective rights</h3>${x.perms.includes('*')?'<div class="sec">Everything (President).</div>':x.perms.length?x.perms.map(p=>`<div class="lrow"><div class="body"><b>${esc(p)}</b><div class="meta">${esc(permLabel(p))}</div></div></div>`).join(''):'<div class="muted">No rights.</div>'}<div class="modal-f"><button class="btn primary" onclick="closeModal(this)">Close</button></div>`,{title:x.email})};
const exportAccess=()=>{const rows=[['name','email','department','role','head','president','active','rights','last_sign_in']].concat(window._ar.map(x=>[x.name,x.email,x.department,x.role||'',x.is_head,x.is_super,x.active,x.perms.join(' '),x.last_login?new Date(x.last_login*1000).toISOString():'']));
  const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='access-review.csv';a.click()};

async function deptPage(id){const d=await api('/api/admin/org/departments/'+id);const dep=d.department,mem=d.members,roles=d.roles,cm=d.can_manage,sup=d.is_super;const tab=ST.dtab||'members';
  const head=mem.find(m=>m.is_head);
  const members=dtable({id:'mem'+id,size:10,toolbar:`<h2 style="flex:1">People (${mem.length})</h2>${cm?`<button class="btn sm primary" onclick="addMember(${id})">${ico('plus','s16')} Add person</button>`:''}`,head:[{l:'Person'},{l:'Role'},{l:'Rights',num:1},{l:'Personal changes'},{l:'Status'},{l:'Last sign-in'},{l:''}],emptyState:{icon:'people',title:'No people yet',text:cm?'Add the first person to this department.':''},
   rows:mem.map(m=>({cells:[`<div class="name">${avatar(m.name||m.email,'s32')}<div><b>${esc(m.name||m.email)}</b><small>${esc(m.job_title||m.email)}</small></div></div>`,m.is_super?badge('critical','President'):m.is_head?badge('info','Head'):esc(m.role||'–'),m.perms.includes('*')?'All':m.perms.length,
    (m.extra_perms.length?`<span class="badge success">+${m.extra_perms.length} granted</span> `:'')+(m.denied_perms.length?`<span class="badge warning">−${m.denied_perms.length} withheld</span>`:'')||'<span class="muted">–</span>',m.active?badge('active'):badge('closed','disabled'),`<span class="muted">${m.last_login?ago(m.last_login):'never'}</span>`,
    cm&&(sup||(!m.is_head&&m.id!==ME.id))?rowMenu([{label:'Edit rights…',run:()=>editRights(id,m,dep,roles)},{label:'Reset password',run:()=>resetPw(m)},{label:m.active?'Disable account':'Enable account',danger:m.active,run:()=>setActive(m,!m.active)},
      ...(sup&&!m.is_head?[{label:'Make department head',run:()=>makeHead(id,m)}]:[]),...(sup&&m.face_enrolled!==null?[{label:'Issue face enrollment code',run:()=>enrollCode(m)}]:[]),...(sup?[{label:'Move to another department…',run:()=>moveMember(m)}]:[])]):'']}))});
  const rolesT=dtable({id:'rol'+id,size:10,toolbar:`<h2 style="flex:1">Roles (${roles.length})</h2>${cm?`<button class="btn sm primary" onclick="roleDlg(${id})">${ico('plus','s16')} New role</button>`:''}`,head:[{l:'Role'},{l:'Rights'},{l:'People',num:1},{l:''}],emptyState:{icon:'key',title:'No roles yet',text:'Create a role to give people a standard set of rights.'},
   rows:roles.map(r=>({cells:[`<b>${esc(r.name)}</b>`,ptags(r.permissions),r.members,cm?rowMenu([{label:'Edit role…',run:()=>roleDlg(id,r)},{label:'Delete role',danger:true,run:()=>delRole(r)}]):'']}))});
  return `<div class="pagehead"><button class="btn" onclick="nav('organization')">← Organization</button><div class="sp"></div>${sup?`<button class="btn" onclick='editDept(${JSON.stringify({id,name:dep.name,description:dep.description,ceiling:dep.ceiling,active:dep.active}).replace(/'/g,"&#39;")})'>Edit department and ceiling</button>`:''}</div>
  <div class="card" style="margin-bottom:var(--sv-space-6)"><div class="row nowrap"><span class="tile">${ico('org')}</span><div class="sp"><h2 style="font-size:18px;line-height:28px">${esc(dep.name)}</h2><div class="sec">${esc(dep.description||'')}</div></div>${dep.active?badge('active'):badge('closed','inactive')}</div>
   <div class="row" style="margin-top:var(--sv-space-4);gap:var(--sv-space-6)"><span class="sec">Head: <b>${head?esc(head.name||head.email):'not appointed'}</b></span><span class="sec">People: <b>${mem.length}</b></span></div>
   <h3 style="margin:var(--sv-space-4) 0 var(--sv-space-2)">Department ceiling: the most anyone here can ever hold</h3><div>${ptags(dep.ceiling,20)}</div>
   ${cm&&!sup?`<p class="caption" style="margin-top:var(--sv-space-3)">You are this department's head. You can give your people any right inside the ceiling. Only the President can change the ceiling.</p>`:''}</div>
  <div class="tabs" role="tablist">${[['members','People'],['roles','Roles']].map(([k,l])=>`<button role="tab" aria-selected="${k===tab}" class="${k===tab?'on':''}" onclick="ST.dtab='${k}';render()">${l}</button>`).join('')}</div>${tab==='roles'?rolesT:members}`}

const newDept=()=>{formDlg({title:'New department',submit:'Create department',note:'Choose the ceiling carefully: it is the most anyone in this department can ever hold.',body:`${field('Name','<input id="nd1">')}${field('Code (short, lowercase)','<input id="nd2" placeholder="legal">')}${field('Description','<input id="nd3">')}<h3 style="margin:var(--sv-space-4) 0 var(--sv-space-2)">Ceiling</h3>${permMatrix(null,[],'ceil')}`,
  onSubmit:async m=>{const r=await api('/api/admin/org/departments',{json:{name:m.querySelector('#nd1').value,code:m.querySelector('#nd2').value,description:m.querySelector('#nd3').value,ceiling:picked(m,'ceil')}});toast('Department created');nav('organization/'+r.id)}})};
const editDept=d=>formDlg({title:'Edit '+d.name,submit:'Save',note:'Shrinking the ceiling immediately removes those rights from every role and person in the department.',body:`${field('Name',`<input id="ed1" value="${esc(d.name)}">`)}${field('Description',`<input id="ed2" value="${esc(d.description||'')}">`)}<label class="check" style="margin:var(--sv-space-3) 0"><input type="checkbox" id="ed3" ${d.active?'checked':''}> Department is active</label><h3 style="margin:var(--sv-space-4) 0 var(--sv-space-2)">Ceiling</h3>${permMatrix(null,d.ceiling,'ceil')}`,
  onSubmit:async m=>{await api('/api/admin/org/departments/'+d.id,{json:{name:m.querySelector('#ed1').value,description:m.querySelector('#ed2').value,active:m.querySelector('#ed3').checked,ceiling:picked(m,'ceil')}});toast('Department saved');render()}});
const addMember=async id=>{const d=await api('/api/admin/org/departments/'+id);formDlg({title:'Add a person to '+d.department.name,wide:false,submit:'Create account',note:'They get a temporary password and must choose their own at first sign-in.',body:`${field('Email','<input id="am1" type="email">')}${field('Name','<input id="am2">')}${field('Job title','<input id="am3">')}${field('Role',`<select id="am4"><option value="">No role yet</option>${d.roles.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select>`)}`,
  onSubmit:async m=>{const r=await api(`/api/admin/org/departments/${id}/members`,{json:{email:m.querySelector('#am1').value,name:m.querySelector('#am2').value,job_title:m.querySelector('#am3').value,role_id:+m.querySelector('#am4').value||null}});shown('Account created',`<p><b>${esc(r.email)}</b><br>Temporary password <b>${esc(r.temporary_password)}</b></p><p class="caption">Shown once. Pass it on securely.</p>`);render()}})};
const editRights=(id,m,dep,roles)=>formDlg({title:'Rights for '+(m.name||m.email),submit:'Save rights',note:`Everything here stays inside the ${esc(dep.name)} ceiling. The change is recorded in the security log.`,
  body:`${field('Role',`<select id="er1"><option value="">No role</option>${roles.map(r=>`<option value="${r.id}" ${r.id===m.role_id?'selected':''}>${esc(r.name)}</option>`).join('')}</select>`)}${field('Job title',`<input id="er2" value="${esc(m.job_title||'')}">`)}
   <h3 style="margin:var(--sv-space-4) 0 var(--sv-space-2)">Extra rights (in addition to the role)</h3>${permMatrix(dep.ceiling,m.extra_perms,'extra')}<h3 style="margin:var(--sv-space-4) 0 var(--sv-space-2)">Withheld rights (taken away even if the role has them)</h3>${permMatrix(dep.ceiling,m.denied_perms,'deny')}`,
  onSubmit:async mm=>{await api('/api/admin/org/members/'+m.id,{json:{role_id:+mm.querySelector('#er1').value||null,job_title:mm.querySelector('#er2').value,extra_perms:picked(mm,'extra'),denied_perms:picked(mm,'deny')}});toast('Rights updated');render()}});
const roleDlg=(id,r)=>api('/api/admin/org/departments/'+id).then(d=>formDlg({title:r?'Edit role':'New role',submit:'Save role',wide:true,body:`${field('Role name',`<input id="rd1" value="${esc(r?.name||'')}">`)}<h3 style="margin:var(--sv-space-4) 0 var(--sv-space-2)">Rights (limited to the department ceiling)</h3>${permMatrix(d.department.ceiling,r?.permissions||[],'role')}`,
  onSubmit:async m=>{const body={name:m.querySelector('#rd1').value,permissions:picked(m,'role')};if(r)await api('/api/admin/org/roles/'+r.id,{json:body});else await api(`/api/admin/org/departments/${id}/roles`,{json:body});toast('Role saved');render()}}));
const delRole=r=>sure('Delete role '+r.name+'?','Nobody may hold it. This cannot be undone.',async()=>{await api('/api/admin/org/roles/'+r.id,{method:'DELETE'});render()},{label:'Delete role'});
const resetPw=m=>sure('Reset password for '+(m.name||m.email)+'?','They are signed out everywhere and must choose a new password.',async()=>{const r=await api(`/api/admin/org/members/${m.id}/reset-password`,{method:'POST'});shown('Temporary password',`<p><b style="font-size:20px">${esc(r.temporary_password)}</b></p><p class="caption">Shown once.</p>`)},{label:'Reset password',danger:false});
const setActive=(m,on)=>sure((on?'Enable ':'Disable ')+(m.name||m.email)+'?',on?'They can sign in again.':'They are signed out everywhere immediately.',async()=>{await api('/api/admin/org/members/'+m.id,{json:{active:on}});render()},{label:on?'Enable':'Disable',danger:!on});
const makeHead=(id,m)=>sure('Make '+(m.name||m.email)+' the department head?','They will hold the whole department ceiling. The previous head keeps only their own role.',async()=>{await api('/api/admin/org/departments/'+id,{json:{head_user_id:m.id}});toast('Head appointed');render()},{label:'Appoint head',danger:false});
const enrollCode=m=>sure('Issue a face enrollment code for '+(m.name||m.email)+'?','A one-time code lets them enrol a new face. Show it only to them.',async()=>{const r=await api(`/api/admin/org/members/${m.id}/enroll-code`,{method:'POST'});shown('Enrollment code',`<p><b style="font-size:22px;letter-spacing:.05em">${esc(r.code)}</b></p><p class="caption">Shown once. It expires in 24 hours.</p>`)},{label:'Issue code',danger:false});
const moveMember=async m=>{const ds=await api('/api/admin/org/departments');ask({title:'Move '+(m.name||m.email),note:'Their role and personal rights are cleared; the new head or the President assigns new ones.',fields:[{id:'department_id',label:'New department',type:'select',options:ds.map(d=>[d.id,d.name])}],submit:'Move',onSubmit:async v=>{await api('/api/admin/org/members/'+m.id,{json:{department_id:+v.department_id}});render()}})};
</script></body></html>
