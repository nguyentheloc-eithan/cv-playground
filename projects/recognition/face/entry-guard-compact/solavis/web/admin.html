<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solavis Admin</title><meta name="robots" content="noindex"><meta name="theme-color" content="#101820"><link rel="stylesheet" href="/assets/app.css"></head><body class="app">
<div id="root"></div>
<script src="/assets/common.js"></script>
<script>
let ME=null,PLANS=[],STAFF=[],ROLES={},timer=null,ST={stage:'',q:'',inv:'',tk:'active',inv_status:'',tasks:'mine',tab:'overview'};
const STAGES=[['','All'],['lead','Lead'],['trial','Trial'],['active','Active'],['past_due','Past due'],['suspended','Suspended'],['closed','Closed']];
const NAV=[['dashboard','Dashboard','home','accounts.read'],['customers','Customers','building','accounts.read'],['billing','Billing','coin','billing.read'],['support','Support','help','support.read'],
  ['inventory','Inventory','box','inventory.read'],['tasks','Tasks','task','tasks'],['staff','Staff','person','staff.manage'],['audit','Audit log','list','audit.read'],['system','System','gear','system.read']];
const can=p=>ME.perms.includes('*')||ME.perms.includes(p);
mountAuth($('root'),{title:'Staff console',role:'staff',onReady:u=>{ME=u;shell()}});
function shell(){$('root').innerHTML=`<div class="mobilebar"><div class="brand" style="font-size:19px">Sol<span>avis</span> <span class="mut" style="font-size:13px">Admin</span></div><div class="sp"></div><button class="sm" onclick="logout()">Log out</button></div>
 <div class="shell2"><nav class="sidebar"><div class="brand">Sol<span>avis</span><small>Console · ${esc(ME.staff_role)}</small></div><div id="nav"></div><div class="me"><div>${esc(ME.email)}</div><button onclick="logout()">Log out</button></div></nav><main class="content" id="pg"></main></div>`;
 window.onhashchange=render;if(!location.hash)nav('dashboard');clearInterval(timer);timer=setInterval(()=>{if(!document.querySelector('.modal')&&!document.activeElement?.matches('input,textarea,select'))render(true)},6000);render()}
async function render(quiet){const r=route();let page=r.page||'dashboard';if(!V[page])page='dashboard';
  $('nav').innerHTML=NAV.filter(n=>can(n[3])).map(([k,l,i])=>`<a class="${k===page?'on':''}" onclick="nav('${k}')">${ico(i)}<span>${l}</span></a>`).join('');
  try{const html=await V[page](r);const y=scrollY;$('pg').innerHTML=html;if(quiet)scrollTo(0,y)}catch(e){if(e.status===401)return location.reload();$('pg').innerHTML=`<div class="banner bad">${esc(e.message)}</div>`}}
const title=(t,right='')=>`<div class="ptitle"><h1>${t}</h1><div class="sp"></div>${right}</div>`;
const stageSel=(id,cur)=>can('accounts.write')?`<select onchange="setT(${id},{status:this.value})">${STAGES.slice(1).map(([k,l])=>`<option value="${k}" ${k===cur?'selected':''}>${l}</option>`).join('')}</select>`:pill(cur);
const planSel=(id,cur)=>can('accounts.write')?`<select onchange="setT(${id},{plan_id:this.value})">${PLANS.map(p=>`<option value="${p.id}" ${p.id===cur?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`:esc(cur);
const invPill=s=>`<span class="pill ${({sent:'past_due',overdue:'suspended',paid:'active',void:'closed',draft:'info'})[s]}">${s==='sent'?'unpaid':s}</span>`;
const loadPlans=async()=>{PLANS=await api('/api/admin/plans')};

const V={
 async dashboard(){await loadPlans();const s=await api('/api/admin/summary');const overdue=can('billing.read')?(await api('/api/admin/invoices?status=overdue')):[];const st=s.by_status;
  return title('Dashboard',can('accounts.write')?`<button class="p" onclick="newCustomer()">+ New customer</button>`:'')+`<div class="kpi">
   <div class="card stat"><span class="l">Monthly recurring revenue</span><b>${vnd(s.mrr)}</b><small>active + past due</small><div class="ic">${ico('coin')}</div></div>
   <div class="card stat"><span class="l">Customers</span><b>${s.tenants}</b><small>${st.active} active · ${st.trial} trial · ${st.lead} lead</small><div class="ic">${ico('building')}</div></div>
   <div class="card stat"><span class="l">Overdue</span><b style="color:${s.overdue_count?'var(--bad)':'inherit'}">${vnd(s.overdue_amount)}</b><small>${s.overdue_count} invoice(s)</small><div class="ic">${ico('alert')}</div></div>
   <div class="card stat"><span class="l">Open tickets</span><b>${s.tickets_open}</b><small>${s.tickets_unassigned} unassigned</small><div class="ic">${ico('help')}</div></div>
   <div class="card stat"><span class="l">Fleet</span><b>${s.fleet.units}</b><small>${s.fleet.online} online · ${s.fleet.locked} locked · ${s.fleet.in_stock} in stock</small><div class="ic">${ico('box')}</div></div>
   <div class="card stat"><span class="l">Last 30 days</span><b>+${s.new_30d}</b><small>${s.churn_30d} closed</small></div></div>
  <div class="two"><div><div class="card"><h2>Pipeline</h2><div class="chips">${STAGES.slice(1).map(([k,l])=>`<button onclick="ST.stage='${k}';nav('customers')">${l}<span class="n">${st[k]}</span></button>`).join('')}</div></div>
   <div class="card"><h2>Trials ending within 7 days</h2>${s.trials_ending.length?s.trials_ending.map(t=>`<div class="row" style="margin:6px 0"><a href="#/customers/${t.id}"><b>${esc(t.name)}</b></a><div class="sp"></div><span class="mut">${dshort(t.trial_end)}</span></div>`).join(''):empty('None.')}</div>
   ${can('billing.read')?`<div class="card"><h2>Overdue invoices</h2>${overdue.length?overdue.slice(0,6).map(i=>`<div class="row" style="margin:6px 0"><a href="#/customers/${i.tenant_id}"><b>${esc(i.tenant)}</b></a><span class="mut">${esc(i.number)}</span><div class="sp"></div><b>${vnd(i.total)}</b></div>`).join(''):empty('Nothing overdue.')}</div>`:''}</div>
  <div><div class="card"><h2>My tasks</h2>${s.my_tasks.length?s.my_tasks.map(t=>`<div class="row" style="margin:6px 0"><button class="sm" onclick="doneTask(${t.id})" title="Mark done">✓</button><div class="sp"><b>${esc(t.title)}</b><div class="mut" style="font-size:12px">${esc(t.tenant||'')} · due ${dshort(t.due)}</div></div></div>`).join(''):empty('No open tasks.')}</div>
   ${can('support.read')?`<div class="card"><h2>Recent tickets</h2>${s.recent_tickets.length?s.recent_tickets.map(t=>`<div class="row" style="margin:6px 0"><a href="#/support/${t.id}"><b>#${t.id} ${esc(t.subject)}</b></a><div class="sp"></div>${pill(t.status)}</div><div class="mut" style="font-size:12px;margin-top:-4px">${esc(t.tenant)} · ${ago(t.updated)}</div>`).join(''):empty('Queue is clear.')}</div>`:''}</div></div>`},

 async customers(r){await loadPlans();if(r.id)return customerPage(+r.id);const a=await api(`/api/admin/tenants?q=${encodeURIComponent(ST.q)}`);const all=ST.q?a:a;const counts={};a.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);
  const rows=a.filter(x=>!ST.stage||x.status===ST.stage);
  return title('Customers',can('accounts.write')?`<button class="p" onclick="newCustomer()">+ New customer</button>`:'')+`<div class="row"><input id="q" placeholder="Search name, contact, phone…" value="${esc(ST.q)}" style="min-width:260px" onkeydown="if(event.key==='Enter'){ST.q=this.value;render()}"><button onclick="ST.q=$('q').value;render()">Search</button></div>`+
  chips(STAGES.map(([k,l])=>[k,l,k?counts[k]||0:a.length]),ST.stage,'setStage')+`<div class="card scroll">${rows.length?`<table class="t"><tr><th>Customer</th><th>Stage</th><th>Plan</th><th>Monthly</th><th>Devices</th><th>Tickets</th><th>Unpaid</th><th>Manager</th><th>Created</th></tr>
   ${rows.map(t=>`<tr class="click" onclick="nav('customers/${t.id}')"><td><b>${esc(t.name)}</b><div class="mut" style="font-size:12px">${esc(t.contact_name||'')} ${esc(t.phone||'')}</div></td><td>${pill(t.effective_status)}${t.effective_status!==t.status?' <span class="mut">('+t.status+')</span>':''}</td><td>${esc(t.plan_name)}</td><td>${['active','past_due'].includes(t.status)?vnd(t.price_vnd):'–'}</td><td>${t.cameras}/${t.max_cameras}</td><td>${t.open_tickets||'–'}</td><td>${t.unpaid?`<b style="color:var(--bad)">${vnd(t.unpaid)}</b>`:'–'}</td><td class="mut">${esc((t.account_manager||'').split('@')[0])}</td><td class="mut">${dshort(t.created)}</td></tr>`).join('')}</table>`:empty('No customers match.')}</div>`},

 async billing(){await loadPlans();const inv=await api('/api/admin/invoices');const f=ST.inv_status;const rows=inv.filter(i=>!f||i.state===f);const sum=s=>inv.filter(i=>i.state===s).reduce((a,i)=>a+i.total,0);
  return title('Billing',can('billing.write')?`<button class="p" onclick="newInvoice()">+ New invoice</button>`:'')+`<div class="kpi"><div class="card stat"><span class="l">Unpaid</span><b>${vnd(sum('sent'))}</b></div><div class="card stat"><span class="l">Overdue</span><b style="color:var(--bad)">${vnd(sum('overdue'))}</b></div><div class="card stat"><span class="l">Collected (listed)</span><b>${vnd(sum('paid'))}</b></div><div class="card stat"><span class="l">MRR</span><b>${vnd((await api('/api/admin/summary')).mrr)}</b></div></div>`+
  chips([['','All',inv.length],['sent','Unpaid'],['overdue','Overdue'],['paid','Paid'],['void','Void']],f,'setInv')+`<div class="card scroll">${rows.length?`<table class="t"><tr><th>Invoice</th><th>Customer</th><th>Description</th><th>Issued</th><th>Due</th><th>Amount</th><th>Status</th><th></th></tr>${rows.map(i=>`<tr><td><b>${esc(i.number)}</b></td><td><a href="#/customers/${i.tenant_id}">${esc(i.tenant)}</a></td><td class="mut">${esc(i.description)}</td><td>${dshort(i.issued)}</td><td>${dshort(i.due)}</td><td>${vnd(i.total)}</td><td>${invPill(i.state)}</td>
   <td>${can('billing.write')&&['sent','overdue'].includes(i.state)?`<button class="sm p" onclick="payInv(${i.id},'${esc(i.number)}')">Mark paid</button> <button class="sm d" onclick="voidInv(${i.id})">Void</button>`:''}</td></tr>`).join('')}</table>`:empty('No invoices.')}</div>
  <div class="card"><div class="row" style="margin:0"><h2 style="margin:0">Plans</h2><div class="sp"></div>${can('plans.write')?`<button class="sm" onclick="editPlan()">+ New plan</button>`:''}</div><table class="t"><tr><th>Id</th><th>Name</th><th>Price / month</th><th>Cameras</th><th>People</th><th>Events/day</th><th>Watch list</th><th></th></tr>${PLANS.map(p=>`<tr><td>${p.id}</td><td><b>${esc(p.name)}</b></td><td>${vnd(p.price_vnd)}</td><td>${p.max_cameras}</td><td>${p.max_people}</td><td>${p.events_per_day}</td><td>${p.watchlist?'yes':'no'}</td><td>${can('plans.write')?`<button class="sm" onclick='editPlan(${JSON.stringify(p)})'>Edit</button>`:''}</td></tr>`).join('')}</table><p class="mut" style="margin-bottom:0">Plan changes apply to every customer on that plan at once. Prices are in the database; the shipped values are samples.</p></div>`},

 async support(r){if(r.id)return ticketPage(+r.id);await loadStaff();const q=ST.tk==='me'?'?assignee=me&status=active':ST.tk==='none'?'?assignee=none&status=active':ST.tk==='active'?'?status=active':'?status='+ST.tk;const t=await api('/api/admin/tickets'+q);
  return title('Support queue')+chips([['active','Active'],['me','Mine'],['none','Unassigned'],['solved','Solved'],['closed','Closed']],ST.tk,'setTk')+`<div class="card scroll">${t.length?`<table class="t"><tr><th>#</th><th>Subject</th><th>Customer</th><th>Priority</th><th>Status</th><th>Assignee</th><th>Updated</th></tr>${t.map(x=>`<tr class="click" onclick="nav('support/${x.id}')"><td>${x.id}</td><td><b>${esc(x.subject)}</b><div class="mut" style="font-size:12px">${esc(x.category)}</div></td><td>${esc(x.tenant)}</td><td>${x.priority==='high'?'<span class="pill critical">high</span>':esc(x.priority)}</td><td>${pill(x.status)}</td><td class="mut">${esc((x.assignee||'unassigned').split('@')[0])}</td><td class="mut">${ago(x.updated)}</td></tr>`).join('')}</table>`:empty('Nothing here. Nice.')}</div>`},

 async inventory(){await loadPlans();const t=await api('/api/admin/tenants');const it=await api('/api/admin/inventory');const f=ST.inv;const rows=it.filter(i=>!f||i.status===f);const n=s=>it.filter(i=>i.status===s).length;
  return title('Device inventory',can('inventory.write')?`<button class="p" onclick="addUnits()">+ Add units</button>`:'')+`<div class="kpi"><div class="card stat"><span class="l">In stock</span><b>${n('in_stock')}</b></div><div class="card stat"><span class="l">Assigned</span><b>${n('assigned')}</b></div><div class="card stat"><span class="l">Returned / RMA</span><b>${n('rma')}</b></div><div class="card stat"><span class="l">Retired</span><b>${n('retired')}</b></div></div>`+
  chips([['','All',it.length],['in_stock','In stock'],['assigned','Assigned'],['rma','RMA'],['retired','Retired']],f,'setInvF')+`<div class="card scroll">${rows.length?`<table class="t"><tr><th>Serial</th><th>Model</th><th>Status</th><th>Customer</th><th>Camera</th><th>Warranty</th><th>Cost</th><th></th></tr>${rows.map(i=>`<tr><td><b>${esc(i.serial)}</b></td><td>${esc(i.model)}</td><td>${pill(i.status==='in_stock'?'active':i.status==='assigned'?'trial':i.status==='rma'?'past_due':'closed').replace(/>[^<]*</,'>'+i.status.replace('_',' ')+'<')}</td>
   <td>${i.tenant?`<a href="#/customers/${i.tenant_id}">${esc(i.tenant)}</a>`:'–'}</td><td>${i.camera_state?pill(i.camera_state):'–'} <span class="mut">${i.last_seen?ago(i.last_seen):''}</span></td><td class="mut">${dshort(i.warranty_until)}</td><td class="mut">${i.cost_vnd?vnd(i.cost_vnd):'–'}</td>
   <td>${can('inventory.write')&&i.status==='in_stock'?`<button class="sm p" onclick='assignUnit(${i.id},"${esc(i.serial)}",${JSON.stringify(t.map(x=>[x.id,x.name]))})'>Assign</button>`:''}${can('devices.revoke')&&i.status==='assigned'?` <button class="sm d" onclick="deviceAct(${i.id},'rma','${esc(i.serial)}')">Return / lost</button>`:''}${can('devices.revoke')&&['rma','retired'].includes(i.status)?` <button class="sm" onclick="deviceAct(${i.id},'restock','${esc(i.serial)}')">Restock</button>`:''}</td></tr>`).join('')}</table>`:empty('No units.')}</div>
  <p class="mut">Staff manage units as assets. Live camera control, faces and snapshots belong to the customer and are not visible here.</p>`},

 async tasks(){await loadStaff();const t=await api('/api/admin/tasks?scope='+ST.tasks);
  return title('Tasks',`<button class="p" onclick="newTask()">+ New task</button>`)+chips([['mine','Mine'],['all','Everyone']],ST.tasks,'setTasks')+`<div class="card">${t.length?t.map(x=>`<div class="row" style="margin:6px 0;${x.status==='done'?'opacity:.5':''}">${x.status==='open'?`<button class="sm" onclick="doneTask(${x.id})">✓</button>`:'<span class="pill active">done</span>'}<div class="sp"><b>${esc(x.title)}</b><div class="mut" style="font-size:12px">${x.tenant?`<a href="#/customers/${x.tenant_id}">${esc(x.tenant)}</a> · `:''}due ${dshort(x.due)} · ${esc((x.assignee||'').split('@')[0])}</div></div></div>`).join(''):empty('No tasks.')}</div>`},

 async staff(){const [s,roles]=await Promise.all([api('/api/admin/staff'),api('/api/admin/roles')]);ROLES=roles;
  return title('Staff',`<button class="p" onclick="newStaff()">+ Add staff</button>`)+`<div class="card scroll"><table class="t"><tr><th>Email</th><th>Role</th><th>Last login</th><th></th></tr>${s.map(x=>`<tr><td><b>${esc(x.email)}</b> ${x.active?'':pill('closed')}</td><td>${x.id===ME.id?esc(x.staff_role):`<select onchange="setRole(${x.id},this.value)">${Object.keys(roles).map(r=>`<option ${r===x.staff_role?'selected':''}>${r}</option>`).join('')}</select>`}</td><td class="mut">${x.last_login?ago(x.last_login):'never'}</td>
   <td>${x.id!==ME.id?`<button class="sm" onclick="userAct(${x.id},'reset-password')">Reset password</button> <button class="sm d" onclick="userAct(${x.id},'${x.active?'disable':'enable'}')">${x.active?'Disable':'Enable'}</button>`:''}</td></tr>`).join('')}</table></div>
  <div class="card"><h2>What each role can do</h2><table class="t">${Object.entries(roles).map(([r,p])=>`<tr><td><b>${r}</b></td><td class="mut">${p.includes('*')?'everything':p.join(', ')}</td></tr>`).join('')}</table><p class="mut" style="margin-bottom:0">Edit <code>solavis/config/roles.yaml</code> to change roles.</p></div>`},

 async audit(){const a=await api('/api/admin/audit?limit=300');return title('Audit log')+`<div class="card scroll"><table class="t"><tr><th>Time</th><th>Actor</th><th>Action</th><th>Detail</th><th>Customer</th></tr>${a.map(x=>`<tr><td class="mut">${when(x.ts)}</td><td>${esc(x.actor)}</td><td>${esc(x.action)}</td><td class="mut">${esc(x.target)}</td><td>${x.tenant_id?`<a href="#/customers/${x.tenant_id}">#${x.tenant_id}</a>`:''}</td></tr>`).join('')}</table></div>`},
 async system(){const s=await api('/api/admin/system');return title('System')+`<div class="kpi">${Object.entries(s.checks).map(([k,v])=>`<div class="card stat"><span class="l">${k}</span><b>${v==='ok'?pill('ok'):pill('fail')}</b><small>${v==='ok'?'':esc(v)}</small></div>`).join('')}</div>${s.warnings.length?`<div class="banner">${s.warnings.map(esc).join('<br>')}</div>`:''}
  <div class="card"><h2>Effective configuration (secrets hidden)</h2><pre style="overflow:auto;font-size:12px;margin:0">${esc(JSON.stringify(s.config,null,2))}</pre><p class="mut">Edit the YAML files in solavis/config (or SOLAVIS_CONFIG_DIR) and restart.</p></div>`}};
V.system.live=false;
const setStage=k=>{ST.stage=k;render()},setInv=k=>{ST.inv_status=k;render()},setTk=k=>{ST.tk=k;render()},setInvF=k=>{ST.inv=k;render()},setTasks=k=>{ST.tasks=k;render()};
async function loadStaff(){if(can('staff.manage'))STAFF=(await api('/api/admin/staff')).map(x=>x.email);else STAFF=[ME.email]}

// ── customer page ──
async function customerPage(id){const d=await api('/api/admin/tenants/'+id);const t=d.tenant;const tab=ST.tab;
  const tabs=[['overview','Overview'],['billing','Billing',d.invoices.length],['support','Support',d.tickets.filter(x=>['open','pending'].includes(x.status)).length||''],['devices','Devices',d.devices.length],['people','Contacts & users',d.contacts.length+d.users.length],['notes','Notes & tasks',d.notes.length],['activity','Activity']];
  let body='';
  if(tab==='overview')body=`<div class="two"><div class="card"><h2>Profile</h2><dl class="kv"><dt>Contact</dt><dd>${esc(t.contact_name||'–')}</dd><dt>Phone</dt><dd>${esc(t.phone||'–')}</dd><dt>Address</dt><dd>${esc(t.address||'–')}</dd><dt>Tax code</dt><dd>${esc(t.tax_code||'–')}</dd><dt>Industry</dt><dd>${esc(t.industry||'–')}</dd><dt>Source</dt><dd>${esc(t.source||'–')}</dd><dt>Account manager</dt><dd>${esc(t.account_manager||'–')}</dd><dt>Customer since</dt><dd>${dshort(t.created)}</dd></dl></div>
   <div class="card"><h2>Subscription</h2><div class="row" style="margin:0"><b style="font-size:20px">${esc(t.plan_name)}</b>${pill(t.effective_status)}</div><div style="font-size:18px;margin:4px 0">${vnd(t.price_vnd)} <span class="mut" style="font-size:13px">/ month</span></div>${t.status==='trial'?`<div class="mut">Trial ends ${dshort(t.trial_end)}</div>`:''}
   <div style="margin-top:8px"><div class="row" style="margin:2px 0"><span>Devices</span><div class="sp"></div><span class="mut">${d.devices.length}/${t.max_cameras}</span></div><div class="row" style="margin:2px 0"><span>People (count only)</span><div class="sp"></div><span class="mut">${d.people_count}/${t.max_people}</span></div><div class="row" style="margin:2px 0"><span>Events today</span><div class="sp"></div><span class="mut">${t.events_today}/${t.events_per_day}</span></div></div></div></div>
   ${d.notes.filter(n=>n.pinned).length?`<div class="card"><h2>Pinned notes</h2>${d.notes.filter(n=>n.pinned).map(n=>`<div style="margin:6px 0">${esc(n.text)}<div class="mut" style="font-size:12px">${esc(n.author)} · ${ago(n.created)}</div></div>`).join('')}</div>`:''}`;
  if(tab==='billing')body=`<div class="card"><div class="row" style="margin:0"><h2 style="margin:0">Invoices</h2><div class="sp"></div>${can('billing.write')?`<button class="sm p" onclick="newInvoice(${id})">+ New invoice</button>`:''}</div>${d.invoices.length?`<table class="t"><tr><th>Invoice</th><th>Issued</th><th>Due</th><th>Amount</th><th>Status</th><th></th></tr>${d.invoices.map(i=>`<tr><td><b>${esc(i.number)}</b></td><td>${dshort(i.issued)}</td><td>${dshort(i.due)}</td><td>${vnd(i.total)}</td><td>${invPill(i.state)}</td><td>${can('billing.write')&&['sent','overdue'].includes(i.state)?`<button class="sm p" onclick="payInv(${i.id},'${esc(i.number)}')">Mark paid</button> <button class="sm d" onclick="voidInv(${i.id})">Void</button>`:''}</td></tr>`).join('')}</table>`:empty(can('billing.read')?'No invoices yet.':'Your role cannot see billing.')}</div>`;
  if(tab==='support')body=`<div class="card">${d.tickets.length?`<table class="t"><tr><th>#</th><th>Subject</th><th>Status</th><th>Updated</th></tr>${d.tickets.map(x=>`<tr class="click" onclick="nav('support/${x.id}')"><td>${x.id}</td><td><b>${esc(x.subject)}</b></td><td>${pill(x.status)}</td><td class="mut">${ago(x.updated)}</td></tr>`).join('')}</table>`:empty('No tickets.')}</div>`;
  if(tab==='devices')body=`<div class="card">${d.devices.length?`<table class="t"><tr><th>Serial</th><th>Name</th><th>State</th><th>Last seen</th><th>Battery</th><th>Firmware</th><th>Warranty</th></tr>${d.devices.map(x=>`<tr><td><b>${esc(x.serial||'–')}</b></td><td>${esc(x.name||'')}${x.claim_code?`<div class="mut" style="font-size:12px">claim code ${esc(x.claim_code)}</div>`:''}</td><td>${x.state?pill(x.state):'–'}</td><td class="mut">${ago(x.last_seen)}</td><td>${batt(x.battery)}</td><td class="mut">${esc(x.fw_version||'–')}</td><td class="mut">${dshort(x.warranty_until)}</td></tr>`).join('')}</table>`:empty('No devices assigned. Assign one from Inventory.')}<p class="mut" style="margin-bottom:0">Status only. Returns, lost or stolen units are handled in Inventory with a recorded reason.</p></div>`;
  if(tab==='people')body=`<div class="two"><div class="card"><div class="row" style="margin:0"><h2 style="margin:0">Contacts</h2><div class="sp"></div>${can('accounts.write')?`<button class="sm" onclick="addContact(${id})">+ Add</button>`:''}</div>${d.contacts.length?d.contacts.map(c=>`<div class="row" style="margin:8px 0"><div class="sp"><b>${esc(c.name)}</b> <span class="mut">${esc(c.title||'')}</span><div class="mut" style="font-size:13px">${esc(c.email||'')} ${esc(c.phone||'')}</div></div>${can('accounts.write')?`<button class="sm d" onclick="delContact(${c.id})">✕</button>`:''}</div>`).join(''):empty('No contacts.')}</div>
   <div class="card"><h2>Sign-in accounts</h2>${d.users.length?d.users.map(u=>`<div class="row" style="margin:8px 0"><div class="sp"><b>${esc(u.email)}</b> ${pill(u.role==='owner'?'active':'info').replace(/>[^<]*</,'>'+u.role+'<')} ${u.active?'':pill('closed')}<div class="mut" style="font-size:12px">${u.last_login?'last login '+ago(u.last_login):'never signed in'}</div></div>${can('accounts.write')?`<button class="sm" onclick="userAct(${u.id},'reset-password')">Reset password</button> <button class="sm d" onclick="userAct(${u.id},'${u.active?'disable':'enable'}')">${u.active?'Disable':'Enable'}</button>`:''}</div>`).join(''):empty('No accounts. Create one when the customer is ready.')}</div></div>`;
  if(tab==='notes')body=`<div class="two"><div class="card"><div class="row" style="margin:0"><h2 style="margin:0">Notes</h2><div class="sp"></div><button class="sm" onclick="addNote(${id})">+ Note</button></div>${d.notes.length?d.notes.map(n=>`<div style="margin:10px 0;padding-bottom:8px;border-bottom:1px solid var(--line)">${n.pinned?'📌 ':''}${esc(n.text)}<div class="mut" style="font-size:12px">${esc(n.author)} · ${when(n.created)} · <a href="#" onclick="pinNote(${n.id});return false">${n.pinned?'unpin':'pin'}</a></div></div>`).join(''):empty('No notes.')}</div>
   <div class="card"><div class="row" style="margin:0"><h2 style="margin:0">Tasks</h2><div class="sp"></div><button class="sm" onclick="newTask(${id})">+ Task</button></div>${d.tasks.length?d.tasks.map(x=>`<div class="row" style="margin:8px 0;${x.status==='done'?'opacity:.5':''}">${x.status==='open'?`<button class="sm" onclick="doneTask(${x.id})">✓</button>`:'<span class="pill active">done</span>'}<div class="sp"><b>${esc(x.title)}</b><div class="mut" style="font-size:12px">due ${dshort(x.due)} · ${esc((x.assignee||'').split('@')[0])}</div></div></div>`).join(''):empty('No tasks.')}</div></div>`;
  if(tab==='activity')body=`<div class="card">${d.activity.length?`<div class="timeline">${d.activity.map(a=>`<div><b>${esc(a.action)}</b> <span class="mut">${esc(a.target)}</span><div class="mut" style="font-size:12px">${esc(a.actor)} · ${when(a.ts)}</div></div>`).join('')}</div>`:empty('No activity.')}</div>`;
  return `<div class="ptitle"><button onclick="nav('customers')">← Customers</button><h1>${esc(t.name)}</h1>${stageSel(id,t.status)}${planSel(id,t.plan_id)}<div class="sp"></div>${can('accounts.write')?`<button onclick='editProfile(${JSON.stringify({id,name:t.name,contact_name:t.contact_name,phone:t.phone,address:t.address,tax_code:t.tax_code,industry:t.industry,source:t.source,account_manager:t.account_manager}).replace(/'/g,"&#39;")})'>Edit profile</button>`:''}</div>
  <div class="tabbar">${tabs.map(([k,l,n])=>`<button class="${k===tab?'on':''}" onclick="ST.tab='${k}';render()">${l}${n?` <span class="mut">${n}</span>`:''}</button>`).join('')}</div>${body}`}
async function ticketPage(id){await loadStaff();const d=await api('/api/admin/tickets/'+id);const t=d.ticket;
  return title(`#${t.id} ${esc(t.subject)}`,`<button onclick="nav('support')">← Queue</button>`)+`<div class="two" style="grid-template-columns:2fr 1fr"><div class="card"><div class="mut">${esc(t.requester)} · ${esc(t.category)} · opened ${when(t.created)}</div>${thread(d.messages,'staff')}
   ${can('support.write')?`<label>Reply</label><textarea id="rp" rows="4" style="width:100%"></textarea><div class="row"><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="int"> Internal note (customer cannot see it)</label><div class="sp"></div><button class="p" onclick="replyT(${t.id})">Send</button></div>`:''}</div>
   <div class="card"><h2>Ticket</h2><dl class="kv" style="grid-template-columns:90px 1fr"><dt>Customer</dt><dd><a href="#/customers/${t.tenant_id}">${esc(t.tenant)}</a></dd><dt>Status</dt><dd>${can('support.write')?`<select onchange="updT(${t.id},{status:this.value})">${['open','pending','solved','closed'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select>`:pill(t.status)}</dd>
   <dt>Priority</dt><dd>${can('support.write')?`<select onchange="updT(${t.id},{priority:this.value})">${['low','normal','high'].map(s=>`<option ${s===t.priority?'selected':''}>${s}</option>`).join('')}</select>`:esc(t.priority)}</dd>
   <dt>Assignee</dt><dd>${can('support.write')?`<select onchange="updT(${t.id},{assignee:this.value})"><option value="">unassigned</option>${STAFF.map(s=>`<option ${s===t.assignee?'selected':''}>${esc(s)}</option>`).join('')}</select>`:esc(t.assignee||'–')}</dd><dt>First reply</dt><dd>${t.first_reply_at?Math.round((t.first_reply_at-t.created)/60)+' min':'–'}</dd></dl></div></div>`}

// ── actions ──
const setT=(id,b)=>guard(async()=>{await api('/api/admin/tenants/'+id,{json:b});toast('Saved');render()});
function newCustomer(){const m=ask({title:'New customer',fields:[{id:'name',label:'Company or customer name'},{id:'plan_id',label:'Plan',type:'select',options:PLANS.map(p=>[p.id,`${p.name} · ${vnd(p.price_vnd)}`]),value:PLANS[1]?.id},{id:'status',label:'Stage',type:'select',value:'trial',options:STAGES.slice(1,4)},
  {id:'contact_name',label:'Contact person'},{id:'phone',label:'Phone'},{id:'industry',label:'Industry'},{id:'source',label:'How did they find us?'},{id:'owner_email',label:'Owner email (creates a sign-in account; leave empty for a lead)',type:'email'}],submit:'Create',
  onSubmit:async v=>{const r=await api('/api/admin/tenants',{json:v});if(r.temporary_password)shown('Customer created',`<p>Owner <b>${esc(r.owner_email)}</b><br>Temporary password <b>${esc(r.temporary_password)}</b></p><p class="mut">Shown once. Pass it on securely; the owner must change it at first login.</p>`);else toast('Customer created');nav('customers/'+r.id)}})}
const editProfile=p=>ask({title:'Edit profile',fields:[['name','Name'],['contact_name','Contact person'],['phone','Phone'],['address','Address'],['tax_code','Tax code'],['industry','Industry'],['source','Source'],['account_manager','Account manager (email)']].map(([id,label])=>({id,label,value:p[id]||''})),
  onSubmit:async v=>{await api('/api/admin/tenants/'+p.id,{json:v});render()}});
const addContact=id=>ask({title:'Add contact',fields:[{id:'name',label:'Name'},{id:'title',label:'Job title'},{id:'email',label:'Email'},{id:'phone',label:'Phone'}],onSubmit:async v=>{await api(`/api/admin/tenants/${id}/contacts`,{json:v});render()}});
const delContact=id=>confirm('Remove this contact?')&&guard(async()=>{await api('/api/admin/contacts/'+id,{method:'DELETE'});render()});
const addNote=id=>ask({title:'Add note',fields:[{id:'text',label:'Note',type:'textarea',rows:4},{id:'pinned',label:'Pin to the customer overview',type:'checkbox'}],onSubmit:async v=>{await api(`/api/admin/tenants/${id}/notes`,{json:v});render()}});
const pinNote=id=>api(`/api/admin/notes/${id}/pin`,{method:'POST'}).then(render);
async function newTask(tid){await loadStaff();ask({title:'New task',fields:[{id:'title',label:'What needs doing?'},{id:'due',label:'Due date',type:'date'},{id:'assignee',label:'Assign to',type:'select',options:STAFF,value:ME.email}],
  onSubmit:async v=>{await api('/api/admin/tasks',{json:{title:v.title,assignee:v.assignee,tenant_id:typeof tid==='number'?tid:null,due:v.due?new Date(v.due).getTime()/1000:Date.now()/1000+86400*3}});render()}})}
const doneTask=id=>api(`/api/admin/tasks/${id}/done`,{method:'POST'}).then(render);
async function newInvoice(tid){const t=await api('/api/admin/tenants');ask({title:'New invoice',note:'Amount = plan price × months (+ tax from billing.yaml).',fields:[{id:'tenant_id',label:'Customer',type:'select',options:t.map(x=>[x.id,`${x.name} · ${x.plan_name}`]),value:tid},{id:'months',label:'Months',type:'number',value:1},{id:'description',label:'Description (optional)'}],submit:'Create invoice',
  onSubmit:async v=>{const r=await api('/api/admin/invoices',{json:v});toast('Created '+r.number);render()}})}
const payInv=(id,n)=>ask({title:'Record payment '+n,note:'Marking an invoice paid also activates an overdue, suspended or trial account.',fields:[{id:'method',label:'Method',type:'select',options:['bank_transfer','cash','card','other']},{id:'ref',label:'Bank reference / note'}],submit:'Mark paid',onSubmit:async v=>{await api(`/api/admin/invoices/${id}/paid`,{json:v});render()}});
const voidInv=id=>confirm('Void this invoice?')&&guard(async()=>{await api(`/api/admin/invoices/${id}/void`,{method:'POST'});render()});
const editPlan=p=>{p=p||{id:'',name:'',price_vnd:0,max_cameras:1,max_people:10,events_per_day:100,watchlist:false};ask({title:p.id?'Edit plan':'New plan',fields:[{id:'id',label:'Id (lowercase)',value:p.id},{id:'name',label:'Name',value:p.name},{id:'price_vnd',label:'Price per month (VND)',type:'number',value:p.price_vnd},{id:'max_cameras',label:'Max cameras',type:'number',value:p.max_cameras},{id:'max_people',label:'Max people',type:'number',value:p.max_people},{id:'events_per_day',label:'Events per day',type:'number',value:p.events_per_day},{id:'watchlist',label:'Includes watch list',type:'checkbox',value:p.watchlist}],
  onSubmit:async v=>{await api('/api/admin/plans',{json:v});render()}})};
const addUnits=()=>ask({title:'Add units to stock',fields:[{id:'model',label:'Model',value:'Solavis Cam 4G'},{id:'count',label:'How many',type:'number',value:5},{id:'cost_vnd',label:'Unit cost (VND, internal)',type:'number',value:2000000}],onSubmit:async v=>{await api('/api/admin/inventory',{json:v});render()}});
const assignUnit=(id,serial,tenants)=>ask({title:'Assign '+serial,note:'Creates the customer\'s camera and a claim code to print on the box. Plan limits apply.',fields:[{id:'tenant_id',label:'Customer',type:'select',options:tenants},{id:'name',label:'Camera name',value:'Front gate'}],submit:'Assign',
  onSubmit:async v=>{const r=await api(`/api/admin/inventory/${id}/assign`,{json:v});shown('Assigned',`<p>Claim code <b style="font-size:20px">${esc(r.claim_code)}</b></p><p class="mut">Print it on the box. The camera claims it on first boot.</p>`);render()}});
const deviceAct=(id,a,serial)=>ask({title:(a==='restock'?'Restock ':'Return / lost: ')+serial,danger:a!=='restock',note:a==='restock'?'Puts the unit back in stock.':'The camera\'s key stops working immediately. A reason is recorded in the audit log.',fields:a==='restock'?[]:[{id:'reason',label:'Reason (e.g. customer reported theft, ticket #12)',type:'textarea',rows:2}],submit:'Confirm',onSubmit:async v=>{await api(`/api/admin/inventory/${id}/${a}`,{json:v});render()}});
const newStaff=async()=>{ROLES=await api('/api/admin/roles');ask({title:'Add staff',fields:[{id:'email',label:'Email',type:'email'},{id:'name',label:'Name'},{id:'staff_role',label:'Role',type:'select',options:Object.keys(ROLES),value:'support'}],onSubmit:async v=>{const r=await api('/api/admin/staff',{json:v});shown('Staff created',`<p><b>${esc(r.email)}</b><br>Temporary password <b>${esc(r.temporary_password)}</b></p>`);render()}})};
const setRole=(id,r)=>guard(async()=>{await api(`/api/admin/staff/${id}/role`,{json:{staff_role:r}});toast('Role changed');render()});
const userAct=(id,a)=>guard(async()=>{const r=await api(`/api/admin/users/${id}/${a}`,{method:'POST'});if(r.temporary_password)shown('Temporary password',`<p><b style="font-size:20px">${esc(r.temporary_password)}</b></p><p class="mut">Shown once. The user must change it at next login.</p>`);else toast('Done');render()});
const replyT=id=>guard(async()=>{await api(`/api/admin/tickets/${id}/message`,{json:{body:$('rp').value,internal:$('int').checked}});render()});
const updT=(id,b)=>guard(async()=>{await api('/api/admin/tickets/'+id,{json:b});toast('Saved');render()});
</script></body></html>
