<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solavis</title><meta name="theme-color" content=""><link rel="stylesheet" href="/assets/solavis-tokens.css"><link rel="stylesheet" href="/assets/app.css"></head><body>
<div id="root"></div>
<script src="/assets/common.js"></script>
<script>
let ME=null,O=null,SH=null,timer=null,ST={alerts:'open',visitors:'all',days:14};
const isOwner=()=>ME.role==='owner';
const TITLES={dashboard:['Dashboard'],devices:['Devices','Your cameras and their health'],alerts:['Alerts','Tamper, offline and watch-list notices'],visitors:['Visitors','Everyone your cameras have seen'],people:['People','Known people and your watch list'],
  reports:['Reports','Visitor trends'],activity:['Activity log','Who did what, and when'],support:['Support','Talk to the Solavis team'],billing:['Billing','Plan, invoices and how to pay'],team:['Team','Who can sign in'],settings:['Settings','Notifications, data and password']};
mountAuth($('root'),{title:'Sign in to your gate camera',role:'customer',onReady:u=>{ME=u;boot()}});
function boot(){
  SH=mountShell({root:$('root'),brandSub:'',user:{name:ME.name,email:ME.email,roleLabel:isOwner()?'Account owner':'Family member'},onNav:{bell:()=>nav('alerts')},
   groups:()=>[{label:'Main',items:[['dashboard','Dashboard','dashboard'],['devices','Devices','devices'],['alerts','Alerts','alerts',O?.open_alerts||''],['visitors','Visitors','visitors'],['people','People','people']]},
     {label:'Insights',items:[['reports','Reports','reports'],['activity','Activity log','activity']]},
     {label:'Account',items:[['support','Support','support'],...(isOwner()?[['billing','Billing','billing'],['team','Team','team'],['settings','Settings','settings']]:[])]}]});
  window.onhashchange=()=>render();window.rerender=()=>render();if(!location.hash)nav('dashboard');
  clearInterval(timer);timer=setInterval(()=>{if(!document.querySelector('.modalbg')&&!document.activeElement?.matches('input,textarea,select'))render(true)},3500);render()}
async function render(quiet){
  const r=route();let page=r.page||'dashboard';if(!VIEWS[page])page='dashboard';
  try{O=await api('/api/overview')}catch(e){if(e.status===401)location.reload();return}
  SH.renderNav(page);const ti=TITLES[page];SH.setTitle(ti[0],page==='dashboard'?O.tenant.name:ti[1]);$('belldot').classList.toggle('hide',!O.open_alerts);
  if(quiet&&VIEWS[page].live===false)return;
  if(!quiet&&!$('pg').innerHTML)$('pg').innerHTML=skeleton();
  try{const html=await VIEWS[page](r);const y=scrollY;$('pg').innerHTML=html;if(quiet)scrollTo(0,y)}catch(e){$('pg').innerHTML=`<div class="banner bad">${esc(e.message)}</div>`}}
const banner=()=>{const t=O.tenant;
  if(t.status==='suspended')return `<div class="banner bad">${ico('alert')}<div><b>Your subscription is suspended.</b> Cameras have stopped uploading. See Billing, or contact support to reactivate.</div></div>`;
  if(t.status==='past_due')return `<div class="banner warn">${ico('alert')}<div><b>Payment is overdue.</b> Cameras keep working for a short grace period. See Billing.</div></div>`;
  if(t.status==='trial'&&t.trial_end)return `<div class="banner">${ico('spark'in P?'spark':'check')}<div>Free trial: <b>${Math.max(0,Math.ceil((t.trial_end-O.now)/86400))} days</b> left.</div></div>`;return ''};
const STATE_TXT={unclaimed:'Waiting to be set up.',mounting:'Setting up: mount it, aim at the gate, then arm it.',armed:'Protecting your gate.',service:'Service window: handle the camera, then arm it again.',locked:'Locked: the camera was disturbed. Check it, then unlock.',revoked:'Disabled by Solavis.'};
const TONE={armed:'success',locked:'danger',mounting:'warning',service:'warning',unclaimed:'info',revoked:'neutral'};
const camActions=c=>!isOwner()?'':({mounting:`<button class="btn primary sm" onclick="act(${c.id},'arm')">Arm here</button>`,service:`<button class="btn primary sm" onclick="act(${c.id},'arm')">Arm now</button>`,
  armed:`<button class="btn sm" onclick="act(${c.id},'service')">Service window</button>`,locked:`<button class="btn primary sm" onclick="act(${c.id},'unlock')">Unlock…</button>`}[c.state]||'')+rowMenu([{label:'Rename',run:()=>renameCam(c.id,c.name)}],'Device actions');
const devRow=c=>`<div class="dev"><span class="tile ${TONE[c.state]||'neutral'}">${ico(c.state==='locked'?'lock':'devices')}</span><div class="body"><div class="row"><b style="font-size:16px">${esc(c.name)}</b>${badge(c.state)}${c.lock_reason?badge('locked',c.lock_reason.replace('_',' ')):''}<div class="sp"></div>${camActions(c)}</div>
  <div class="sec">${STATE_TXT[c.state]||''}${c.state==='unclaimed'?` Claim code <b>${esc(c.claim_code)}</b>`:''}</div>
  ${c.state==='unclaimed'?'':`<div class="metas"><span><span class="dot ${c.online?'on':'off'}"></span><b>${c.online?'Online':'Offline'}</b> · seen ${ago(c.last_seen)}</span><span>${batt(c.battery)}</span><span>${esc((c.net||'').toUpperCase())} ${c.rssi??''} dBm</span><span>Visitors 24 h <b>${c.visitors_24h}</b></span><span>Tilt <b>${c.tilt??'–'}°</b> · Heading <b>${c.heading??'–'}°</b></span></div>`}
  <div class="metas"><span>Serial <b>${esc(c.serial||'–')}</b></span><span>Firmware <b>${esc(c.fw_version||'–')}</b></span><span>Warranty <b>${dshort(c.warranty_until)}</b></span></div></div></div>`;
const alertRow=a=>`<div class="lrow">${a.snap?`<img class="thumb" alt="" src="/api/snap/${a.snap}" loading="lazy">`:`<span class="tile ${a.level==='critical'?'danger':a.level==='high'?'warning':'info'}">${ico('alert')}</span>`}<div class="body"><div class="t">${badge(a.level)} ${esc(a.text)}</div><div class="meta">${when(a.ts)}${a.camera?' · '+esc(a.camera):''}</div></div>${a.acked?'<span class="caption">read</span>':`<button class="btn sm" onclick="ack(${a.id})">Got it</button>`}</div>`;
const evCard=e=>`<div class="vcard">${e.snap?`<img class="ph" alt="${esc(e.name||'Unknown visitor')}" src="/api/snap/${e.snap}" onclick="zoom('${e.snap}')" style="cursor:zoom-in" loading="lazy">`:`<div class="ph">${ico('people')}</div>`}<div class="who">${esc(e.name||'Unknown')}</div>
  <div class="row" style="margin:4px 0">${badge(e.kind==='watchlist'?'watchlist':e.verdict)}${e.review==='confirmed'?badge('confirmed'):e.review==='dismissed'?badge('dismissed'):''}</div><div class="meta">${esc(e.camera)} · ${ago(e.ts)}${e.score?' · '+e.score:''}</div>
  ${(e.kind==='watchlist'||e.verdict!=='known')&&e.review==='new'?`<div class="row" style="margin-top:8px"><button class="btn sm" onclick="rev(${e.id},'confirmed')">Confirm</button><button class="btn ghost sm" onclick="rev(${e.id},'dismissed')">Dismiss</button></div>`:''}</div>`;
const mix=days=>[{l:'Known',v:days.reduce((s,x)=>s+x.known,0),c:'c4f',var:'--sv-chart-4'},{l:'Unknown',v:days.reduce((s,x)=>s+x.unknown,0),c:'c2',var:'--sv-chart-2'},{l:'Watch list',v:days.reduce((s,x)=>s+x.watchlist,0),c:'c5f',var:'--sv-chart-5'}];
const KEYS=['known','unknown','watchlist'],LBL=['Known','Unknown','Watch list'],IDX=[3,1,4];

const VIEWS={
 async dashboard(){const t=O.tenant;const [al,ev,rep,dev]=await Promise.all([api('/api/alerts?limit=6'),api('/api/events?limit=12'),api('/api/reports?days=14'),api('/api/devices')]);
  const on=dev.filter(d=>d.online).length,locked=dev.filter(d=>d.state==='locked').length;const open=al.filter(a=>!a.acked);
  return banner()+`<div class="grid kpigrid">${kpi({label:'Devices online',value:`${on}/${dev.length}`,foot:locked?`${locked} locked`:(dev.length&&dev.every(d=>d.state==='unclaimed')?'Waiting for setup':'All calm'),icon:'devices',tone:locked?'danger':(on===dev.length?'success':'warning')})}
   ${kpi({label:'Open alerts',value:O.open_alerts,foot:'Need attention',icon:'alerts',tone:O.open_alerts?'danger':'success'})}
   ${kpi({label:'Visitors today',value:t.events_today,foot:`Limit ${t.events_per_day} per day<div class="bar"><i style="width:${Math.min(100,100*t.events_today/t.events_per_day)}%"></i></div>`,icon:'visitors'})}
   ${kpi({label:'Plan',value:esc(t.plan),foot:badge(t.status),icon:'billing',tone:'info'})}</div>
  <div class="grid"><div class="card c8"><div class="card-h"><h2>Visitors, last 14 days</h2>${legend(LBL,IDX)}</div>${rep.total?stackedBars(rep.days,KEYS,LBL,IDX):empty({icon:'reports',title:'No visitors yet',text:'They appear here once a camera sees someone.'})}</div>
   <div class="card c4"><div class="card-h"><h2>Needs attention</h2><a href="#/alerts">View all</a></div>${open.length?open.slice(0,4).map(alertRow).join(''):empty({icon:'check',title:'All clear',text:'Nothing needs attention.'})}</div></div>
  <div class="grid"><div class="card c12"><div class="card-h"><h2>Devices</h2></div>${dev.length?dev.map(devRow).join(''):empty({icon:'devices',title:'No device yet',text:'Solavis will add your camera to this account.'})}</div></div>
  <div class="grid"><div class="card c12"><div class="card-h"><h2>Latest visitors</h2><a href="#/visitors">View all</a></div>${ev.length?`<div class="vgrid">${ev.map(evCard).join('')}</div>`:empty({icon:'visitors',title:'Nobody has been seen yet'})}</div></div>`},
 async devices(){const dev=await api('/api/devices');return banner()+`<div class="card">${dev.length?dev.map(devRow).join(''):empty({icon:'devices',title:'No device yet',text:'Solavis will add your camera to this account.'})}</div>`},
 async alerts(){const f=ST.alerts;const al=await api('/api/alerts?limit=200');const rows=al.filter(a=>f==='all'||(f==='open'?!a.acked:a.level===f));
  return pageHead(O.open_alerts?`<button class="btn" onclick="ackAll()">Mark all as read</button>`:'')+`<div style="margin-bottom:var(--sv-space-4)">${seg([['open','Open',al.filter(a=>!a.acked).length],['critical','Critical'],['high','High'],['all','All',al.length]],f,'setAlerts')}</div><div class="card">${rows.length?rows.map(alertRow).join(''):empty({icon:'check',title:'No alerts here'})}</div>`},
 async visitors(){const f=ST.visitors;const ev=await api('/api/events?limit=200');const rows=ev.filter(e=>f==='all'||(f==='watchlist'?e.kind==='watchlist':e.verdict===f));
  return `<div style="margin-bottom:var(--sv-space-4)">${seg([['all','All'],['known','Known'],['unknown','Unknown'],['uncertain','Uncertain'],['watchlist','Watch list']],f,'setVisitors')}</div><div class="card">${rows.length?`<div class="vgrid">${rows.map(evCard).join('')}</div>`:empty({icon:'visitors',title:'Nobody here'})}</div>`},
 async people(){const p=await api('/api/people');const t=O.tenant;
  return pageHead(`<span class="sec">${p.length} of ${t.max_people} people used</span>${isOwner()?`<button class="btn primary" onclick="addPersonDlg()">${ico('plus','s18')} Add person</button>`:''}`)+
  dtable({id:'people',head:[{l:'Name'},{l:'List'},{l:'Photos',num:1},{l:'Consent or legal basis'},{l:''}],emptyState:{icon:'people',title:'Nobody registered',text:'Anyone not registered is shown as "unknown".'},
   rows:p.map(x=>({cells:[`<div class="name">${avatar(x.name,'s32')}<div><b>${esc(x.name)}</b></div></div>`,badge(x.kind==='watchlist'?'watchlist':'known',x.kind==='watchlist'?'Watch list':'Known'),x.photos,`<span class="sec">${esc(x.consent)}</span>`,isOwner()?rowMenu([{label:'Delete person',danger:true,run:()=>delPerson(x.id,x.name)}]):''] }))})+
  `<p class="caption" style="margin-top:var(--sv-space-3)">Watch-list results are always a "possible match": a person must verify before acting.</p>`},
 async reports(){const d=ST.days;const r=await api('/api/reports?days='+d);const m=mix(r.days);
  return pageHead(seg([[7,'7 days'],[14,'14 days'],[30,'30 days'],[90,'90 days']],d,'setDays'))+`<div class="grid kpigrid">${kpi({label:'Visitors',value:r.total,icon:'visitors'})}${kpi({label:'Known',value:m[0].v,icon:'check',tone:'success'})}${kpi({label:'Unknown',value:m[1].v,icon:'visitors',tone:'info'})}${kpi({label:'Watch list',value:m[2].v,icon:'alert',tone:m[2].v?'warning':'neutral'})}</div>
  <div class="grid"><div class="card c8"><div class="card-h"><h2>Visitors per day</h2>${legend(LBL,IDX)}</div>${stackedBars(r.days,KEYS,LBL,IDX)}</div><div class="card c4"><div class="card-h"><h2>Visitor mix</h2></div>${donut(m,'visitors')}</div></div>
  <div class="grid"><div class="card c6"><div class="card-h"><h2>Busiest hours</h2></div>${hourBars(r.by_hour)}</div><div class="card c6"><div class="card-h"><h2>Most seen people</h2></div>${r.top_people.length?r.top_people.map(([n,c])=>`<div class="lrow">${avatar(n,'s32')}<div class="body t">${esc(n)}</div><b>${c}</b></div>`).join(''):empty({icon:'people',title:'No recognised visitors yet'})}</div></div>`},
 async activity(){const a=await api('/api/activity');return `<div class="card">${a.length?`<div class="timeline">${a.map(x=>`<div><b>${esc(x.action)}</b> ${x.detail?`<span class="muted">${esc(x.detail)}</span>`:''}<div class="caption">${esc(x.who)} · ${when(x.ts)}</div></div>`).join('')}</div>`:empty({icon:'activity',title:'Nothing yet'})}</div>`},
 async support(r){if(r.id)return ticketView(+r.id);const t=await api('/api/tickets');
  return pageHead(`<button class="btn primary" onclick="newTicket()">${ico('plus','s18')} New ticket</button>`)+dtable({id:'tickets',head:[{l:'#'},{l:'Subject'},{l:'Status'},{l:'Updated'}],emptyState:{icon:'support',title:'No tickets',text:'Need help? Open one and our team will reply here.'},
   rows:t.map(x=>({click:`nav('support/${x.id}')`,cells:[x.id,`<b>${esc(x.subject)}</b>`,badge(x.status),`<span class="muted">${ago(x.updated)}</span>`]}))})},
 async billing(){const b=await api('/api/billing');const t=O.tenant;
  return banner()+`<div class="grid"><div class="card c5"><div class="card-h"><h2>Your plan</h2>${badge(b.status)}</div><div style="font-size:28px;line-height:36px;font-weight:600">${esc(b.plan.name)}</div><div class="sec" style="margin-bottom:var(--sv-space-4)">${vnd(b.plan.price_vnd)} per month</div>
   ${usage('Cameras',O.cameras.length,b.plan.max_cameras)}${usage('People',t.people,b.plan.max_people)}${usage('Visitors today',t.events_today,b.plan.events_per_day)}<div class="caption">Watch list ${b.plan.watchlist?'included':'not included'}</div></div>
   <div class="card c7"><div class="card-h"><h2>How to pay</h2></div><dl class="kv"><dt>Bank</dt><dd>${esc(b.pay_to.bank)}</dd><dt>Account number</dt><dd><b>${esc(b.pay_to.account_no)}</b></dd><dt>Account holder</dt><dd>${esc(b.pay_to.account_name)}</dd><dt>Transfer note</dt><dd>${esc(b.pay_to.note)}</dd></dl>
   <p class="caption" style="margin-top:var(--sv-space-4)">Payments are matched by our finance team, usually within one working day.</p></div></div>`+
  dtable({id:'myinv',head:[{l:'Invoice'},{l:'Description'},{l:'Issued'},{l:'Due'},{l:'Amount',num:1},{l:'Status'},{l:''}],emptyState:{icon:'invoice',title:'No invoices yet'},
   rows:b.invoices.map(i=>({cells:[`<b>${esc(i.number)}</b>`,`<span class="sec">${esc(i.description)}</span>`,dshort(i.issued),dshort(i.due),vnd(i.total),badge(i.state==='sent'?'unpaid':i.state),i.qr_url?`<a href="${i.qr_url}" target="_blank" rel="noopener">QR</a>`:'']}))})},
 async team(){const m=await api('/api/team');return pageHead(`<button class="btn primary" onclick="inviteDlg()">${ico('plus','s18')} Add family member</button>`)+
  dtable({id:'team',head:[{l:'Member'},{l:'Role'},{l:'Last sign-in'},{l:''}],rows:m.map(x=>({cells:[`<div class="name">${avatar(x.email,'s32')}<div><b>${esc(x.email)}</b></div></div>`,badge(x.role),`<span class="muted">${x.last_login?ago(x.last_login):'never'}</span>`,
   x.active?(x.id!==ME.id?rowMenu([{label:'Disable account',danger:true,run:()=>disableMember(x.id)}]):''):badge('closed','disabled')]}))})+`<p class="caption" style="margin-top:var(--sv-space-3)">Family members can view and review visitors, but not change cameras, people or billing.</p>`},
 async settings(){const t=O.tenant;return `<div class="grid"><div class="card c6"><div class="card-h"><h2>Telegram alerts</h2>${t.telegram?badge('connected'):''}</div><p class="sec" style="margin-bottom:var(--sv-space-4)">Get alerts in Telegram. Paste your chat id.</p>${field('Chat id','<input id="tg" placeholder="e.g. 123456789">')}<button class="btn" onclick="saveTg()">Save</button></div>
   <div class="card c6"><div class="card-h"><h2>Your data</h2></div><p class="sec" style="margin-bottom:var(--sv-space-4)">Download everything we hold about your account. Delete people (and their face data) from the People page.</p><a class="btn" href="/api/export" download>${ico('download','s18')} Download my data</a></div></div>
   <div class="grid"><div class="card c6"><div class="card-h"><h2>Password</h2></div>${field('Current password','<input id="o0" type="password">')}${field('New password','<input id="o1" type="password">','8+ characters with a letter and a number')}<button class="btn" onclick="chpw()">Change password</button></div></div>`}};
VIEWS.settings.live=false;
async function ticketView(id){const d=await api('/api/tickets/'+id);const t=d.ticket;
  return pageHead(`<button class="btn" onclick="nav('support')">← All tickets</button>`)+`<div class="card"><div class="card-h"><h2>#${t.id} ${esc(t.subject)}</h2>${badge(t.status)}${['solved','closed'].includes(t.status)?'':`<button class="btn sm" onclick="closeTicket(${t.id})">Mark solved</button>`}</div><div class="caption">${esc(t.category)} · opened ${when(t.created)}</div>${thread(d.messages,'customer')}
   ${field('Reply','<textarea id="rp" rows="3"></textarea>')}<button class="btn primary" onclick="replyTicket(${t.id})">Send reply</button></div>`}
VIEWS.support.live=false;
const setAlerts=k=>{ST.alerts=k;render()},setVisitors=k=>{ST.visitors=k;render()},setDays=k=>{ST.days=+k;render()};
const act=(id,a)=>guard(async()=>{await api(`/api/cameras/${id}/${a}`,{method:'POST'});toast(a==='arm'?'Camera armed':a==='unlock'?'Unlocked. Fix it, then press Arm now (the service window is limited).':'Service window opened');render()});
const renameCam=(id,n)=>ask({title:'Rename device',fields:[{id:'name',label:'Name',value:n}],onSubmit:async v=>{await api(`/api/cameras/${id}/rename`,{json:v});render()}});
const ack=id=>api(`/api/alerts/${id}/ack`,{method:'POST'}).then(()=>render());
const ackAll=()=>api('/api/alerts/ack-all',{method:'POST'}).then(()=>render());
const rev=(id,r)=>api(`/api/events/${id}/review`,{json:{review:r}}).then(()=>render());
const zoom=s=>modal(`${mhead('Visitor')}<img src="/api/snap/${s}" alt="Visitor snapshot" style="width:100%;border-radius:var(--sv-radius-lg)">`,{title:'Visitor'});
const delPerson=(id,name)=>sure('Delete '+name+'?','This removes the person and all of their face data. It cannot be undone.',async()=>{await api('/api/people/'+id,{method:'DELETE'});toast('Person deleted');render()},{label:'Delete'});
function addPersonDlg(){const t=O.tenant;const m=modal(`${mhead('Add a person')}${field('Name','<input id="pn">')}${field('List',`<select id="pk"><option value="known">Known (family, staff)</option>${t.watchlist?'<option value="watchlist">Watch list</option>':''}</select>`)}
  ${field('Clear face photos','<input id="pf" type="file" multiple accept="image/*">','2–5 recommended, one face per photo')}${field('Consent or legal basis','<input id="pc" placeholder="e.g. Family member, agreed in person">','Required')}<div class="err" id="perr" role="alert"></div>
  <div class="modal-f"><button class="btn" onclick="closeModal(this)">Cancel</button><button class="btn primary" id="pgo">Add person</button></div>`,{title:'Add a person'});
  $('pgo').onclick=async()=>{const f=new FormData();f.append('name',$('pn').value);f.append('kind',$('pk').value);f.append('consent',$('pc').value);for(const x of $('pf').files)f.append('photos',x);
   try{const r=await api('/api/people',{method:'POST',body:f});m.close();toast(`Added (${r.photos_used} photo(s) used${r.photos_rejected?', '+r.photos_rejected+' rejected':''})`);render()}catch(e){$('perr').textContent=e.message}}}
const saveTg=()=>guard(async()=>{const r=await api('/api/settings/telegram',{json:{chat_id:$('tg').value}});toast(r.live?'Saved':'Saved. Telegram sending is not switched on by the operator yet.');render()});
const chpw=()=>guard(async()=>{await api('/api/auth/password',{json:{current:$('o0').value,new:$('o1').value}});toast('Password changed')});
const inviteDlg=()=>ask({title:'Add a family member',note:'They can view and review visitors. You pass the temporary password on yourself.',fields:[{id:'email',label:'Email',type:'email'}],submit:'Create account',
  onSubmit:async v=>{const r=await api('/api/team',{json:v});shown('Account created',`<p>Email <b>${esc(r.email)}</b><br>Temporary password <b>${esc(r.temporary_password)}</b></p><p class="caption">Shown only once. They must change it at first login.</p>`);render()}});
const disableMember=id=>sure('Disable this account?','They will no longer be able to sign in.',async()=>{await api(`/api/team/${id}/disable`,{method:'POST'});render()},{label:'Disable'});
const newTicket=()=>ask({title:'New support ticket',wide:true,fields:[{id:'subject',label:'Subject'},{id:'category',label:'Topic',type:'select',options:[['general','General'],['how-to','How do I…'],['device','A device problem'],['billing','Billing'],['privacy','Privacy / my data']]},{id:'priority',label:'Priority',type:'select',value:'normal',options:['low','normal','high']},{id:'body',label:'What do you need?',type:'textarea',rows:5}],submit:'Send',
  onSubmit:async v=>{const r=await api('/api/tickets',{json:v});nav('support/'+r.id)}});
const replyTicket=id=>guard(async()=>{await api(`/api/tickets/${id}/message`,{json:{body:$('rp').value}});render()});
const closeTicket=id=>guard(async()=>{await api(`/api/tickets/${id}/close`,{method:'POST'});render()});
</script></body></html>
